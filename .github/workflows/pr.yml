name: Pull Request Tests

on:
  pull_request:
    branches: [main, beta]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PR Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Metadata
        run: npm run build:metadata

      - name: Build Library
        run: npm run build:prod

      - name: Test Library
        run: npm run test:lib

      - name: Build Tester
        run: npm run build:tester

      - name: Test Tester
        run: npm run test:app

      - name: Check Theme Color Parity
        run: npm run test:theme-colors
