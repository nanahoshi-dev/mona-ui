name: NPM Publish

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: production

    env:
      GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
      GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
      GIT_COMMITTER_NAME: ${{ vars.GIT_AUTHOR_NAME }}
      GIT_COMMITTER_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Use npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Test audit tooling
        run: npm run test:audit

      - name: Audit i18n and RTL readiness
        run: npm run audit:i18n-rtl:strict

      - name: Audit official locales
        run: npm run audit:locales

      - name: Build
        run: npm run build:prod

      - name: Verify built package exports
        run: npm run verify:package

      # The MCP server takes the library's version and bundles its docs, so it builds and tests before either publishes.
      - name: Build MCP server
        run: npm run build:mcp

      - name: Test MCP server
        run: npm run test:mcp

      # Each publish skips a version npm already has, so a re-run after a partial failure picks up where it stopped.
      - name: Publish
        id: publish
        working-directory: dist/mona-ui
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/$version")" = 200 ]; then
            echo "$name@$version is on npm already."
          else
            npm publish --provenance --access public
          fi

      - name: Publish MCP server
        working-directory: dist/mona-ui-mcp
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name/\//%2f}/$version")" = 200 ]; then
            echo "$name@$version is on npm already."
          else
            npm publish --provenance --access public
          fi

      # Only while npm doesn't have the library's version: once it does, the release stands, whatever fails after it.
      # It asks npm, not the step's outcome, since a publish can fail after the version is out.
      - name: Roll back GitHub release on publish failure
        if: failure() && steps.publish.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/@nanahoshi%2fmona-ui/${TAG#v}")" != 404 ]; then
            echo "npm has @nanahoshi/mona-ui@${TAG#v}, or couldn't say, so the release stays."
            exit 0
          fi
          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY"
