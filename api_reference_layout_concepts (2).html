<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Reference Layout Concepts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .inline-code {
      font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      padding: 0.125rem 0.375rem;
      border-radius: 0.375rem;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 min-h-screen pb-20">

  <!-- Top Control Bar -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200/60 dark:border-indigo-800/60">
            Stripe Explorations
          </span>
          <h1 class="text-lg font-semibold tracking-tight">Left Accent Stripe Variations</h1>
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
          5 variations of the left-accent card with type eyebrows &amp; full-width prose
        </p>
      </div>

      <!-- Interactive Preview Controls -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Width Simulator -->
        <div class="inline-flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border border-slate-200/70 dark:border-slate-700/70 text-xs">
          <span class="px-2 text-slate-500 dark:text-slate-400 hidden sm:inline">Container:</span>
          <button onclick="setWidth('max-w-2xl', this)" class="width-btn px-2.5 py-1 rounded-md font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">
            Narrow (672px)
          </button>
          <button onclick="setWidth('max-w-4xl', this)" class="width-btn active px-2.5 py-1 rounded-md font-medium bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition">
            Docs (896px)
          </button>
          <button onclick="setWidth('max-w-5xl', this)" class="width-btn px-2.5 py-1 rounded-md font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">
            Wide (1024px)
          </button>
        </div>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" aria-label="Toggle Dark Mode" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition">
          <svg id="sun-icon" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg id="moon-icon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <!-- Concept Tabs -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 overflow-x-auto">
      <nav class="flex gap-1 border-t border-slate-100 dark:border-slate-800/80 pt-2 pb-0 text-sm" id="tabs-nav">
        <button onclick="selectTab('clean-crisp', this)" class="tab-btn active px-3.5 py-2 font-medium border-b-2 border-indigo-600 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400 whitespace-nowrap transition">
          1. Clean &amp; Crisp
        </button>
        <button onclick="selectTab('tinted-wash', this)" class="tab-btn px-3.5 py-2 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap transition">
          2. Soft Tinted Wash
        </button>
        <button onclick="selectTab('inset-capsule', this)" class="tab-btn px-3.5 py-2 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap transition">
          3. Inset Capsule Stripe
        </button>
        <button onclick="selectTab('borderless-minimal', this)" class="tab-btn px-3.5 py-2 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap transition">
          4. Borderless Minimal
        </button>
        <button onclick="selectTab('stacked-selector', this)" class="tab-btn px-3.5 py-2 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap transition">
          5. Left-Aligned Selector
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Preview Canvas -->
  <main id="preview-container" class="max-w-4xl mx-auto px-4 sm:px-6 mt-8 transition-all duration-300">
    <!-- Rationale Banner -->
    <div id="rationale-box" class="mb-6 p-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h2 id="concept-title" class="text-base font-semibold text-slate-900 dark:text-white"></h2>
        <p id="concept-desc" class="text-sm text-slate-600 dark:text-slate-400 mt-1 leading-relaxed"></p>
      </div>
      <div class="shrink-0 flex flex-wrap gap-1.5" id="concept-tags"></div>
    </div>

    <!-- Rendered Design Area -->
    <div id="design-stage" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-sm p-6 sm:p-8">
      <!-- Injected dynamically -->
    </div>
  </main>

  <!-- Copy Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-12 opacity-0 transition-all duration-200 pointer-events-none bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-medium px-3.5 py-2.5 rounded-lg shadow-lg flex items-center gap-2">
    <svg class="w-4 h-4 text-emerald-400 dark:text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toast-msg">Copied selector</span>
  </div>

  <script>
    // API reference items from the breadcrumb documentation table
    const apiItems = [
      {
        name: 'BreadcrumbComponent',
        kind: 'Component',
        selector: 'mona-breadcrumb',
        descriptionHtml: ''
      },
      {
        name: 'BreadcrumbItemComponent',
        kind: 'Component',
        selector: 'mona-breadcrumb-item',
        descriptionHtml: 'Use as a direct child of <code class="inline-code bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">&lt;mona-breadcrumb&gt;</code>.'
      },
      {
        name: 'BreadcrumbLinkDirective',
        kind: 'Directive',
        selector: 'a[monaBreadcrumbLink]',
        descriptionHtml: 'Makes a projected anchor the item\'s link, so the browser and the router treat it as one: ctrl-click, copy link, <code class="inline-code bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">href</code>, <code class="inline-code bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">routerLink</code>, <code class="inline-code bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">target</code>.'
      },
      {
        name: 'BreadcrumbSeparatorTemplateDirective',
        kind: 'Directive',
        selector: 'ng-template[monaBreadcrumbSeparatorTemplate]',
        descriptionHtml: 'Apply to an <code class="inline-code bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">&lt;ng-template&gt;</code> directly inside <code class="inline-code bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">&lt;mona-breadcrumb&gt;</code> to replace the default <code class="inline-code bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">ChevronRight</code> separator.'
      }
    ];

    const concepts = {
      'clean-crisp': {
        title: '1. Clean & Crisp (Baseline Stripe)',
        desc: 'The foundational unified card with a 3px color-coded left edge (sky for Components, amber for Directives), top-right copyable selector pill, and full-width prose underneath.',
        tags: ['Balanced contrast', 'Zero inner dividers', 'Clean card boundary'],
        render: () => `
          <div class="space-y-3.5">
            ${apiItems.map(item => {
              const stripeClass = item.kind === 'Component'
                ? 'border-l-sky-500 dark:border-l-sky-400'
                : 'border-l-amber-500 dark:border-l-amber-400';
              return `
                <div class="rounded-xl border border-slate-200/90 dark:border-slate-800 border-l-[3px] ${stripeClass} bg-white dark:bg-slate-900/60 px-4 py-3.5 sm:px-5 sm:py-4 transition hover:border-slate-300 dark:hover:border-slate-700">
                  <div class="flex flex-wrap items-start sm:items-center justify-between gap-3">
                    <div class="flex flex-col items-start gap-1">
                      ${renderKindBadge(item.kind)}
                      <a href="#${item.name}" onclick="event.preventDefault()" class="font-mono text-sm font-semibold text-slate-900 dark:text-white hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                        ${item.name}
                      </a>
                    </div>
                    ${renderCopySelector(item.selector)}
                  </div>
                  ${item.descriptionHtml ? `
                    <p class="mt-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                      ${item.descriptionHtml}
                    </p>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `
      },
      'tinted-wash': {
        title: '2. Soft Semantic Tinted Wash',
        desc: 'Pairs a 4px accent border with an ultra-subtle semantic background tint (sky wash for Components, amber wash for Directives) so groups of symbols separate visually at a glance.',
        tags: ['Instant group recognition', 'Subtle surface hue', '4px accent edge'],
        render: () => `
          <div class="space-y-3.5">
            ${apiItems.map(item => {
              const styleClass = item.kind === 'Component'
                ? 'border-sky-200/80 dark:border-sky-900/60 border-l-sky-500 dark:border-l-sky-400 bg-sky-50/35 dark:bg-sky-950/15 hover:border-sky-300 dark:hover:border-sky-800'
                : 'border-amber-200/80 dark:border-amber-900/60 border-l-amber-500 dark:border-l-amber-400 bg-amber-50/35 dark:bg-amber-950/15 hover:border-amber-300 dark:hover:border-amber-800';
              return `
                <div class="rounded-xl border border-l-4 ${styleClass} px-4 py-3.5 sm:px-5 sm:py-4 transition">
                  <div class="flex flex-wrap items-start sm:items-center justify-between gap-3">
                    <div class="flex flex-col items-start gap-1">
                      ${renderKindBadge(item.kind)}
                      <a href="#${item.name}" onclick="event.preventDefault()" class="font-mono text-sm font-semibold text-slate-900 dark:text-white hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                        ${item.name}
                      </a>
                    </div>
                    ${renderCopySelector(item.selector)}
                  </div>
                  ${item.descriptionHtml ? `
                    <p class="mt-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                      ${item.descriptionHtml}
                    </p>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `
      },
      'inset-capsule': {
        title: '3. Inset Rounded Capsule Stripe',
        desc: 'Moves the accent bar inside the card padding as a sleek, rounded vertical capsule rather than a flush outer border—giving the card a softer, modern design-system polish.',
        tags: ['Refined capsule geometry', 'Uniform outer border', 'Modern docs aesthetic'],
        render: () => `
          <div class="space-y-3.5">
            ${apiItems.map(item => {
              const capsuleClass = item.kind === 'Component'
                ? 'bg-sky-500 dark:bg-sky-400'
                : 'bg-amber-500 dark:bg-amber-400';
              return `
                <div class="rounded-xl border border-slate-200/90 dark:border-slate-800 bg-white dark:bg-slate-900/60 p-4 sm:px-5 sm:py-4 transition hover:border-slate-300 dark:hover:border-slate-700 flex items-stretch gap-3.5 sm:gap-4">
                  <div class="w-1 shrink-0 rounded-full ${capsuleClass}"></div>
                  <div class="min-w-0 flex-1">
                    <div class="flex flex-wrap items-start sm:items-center justify-between gap-3">
                      <div class="flex flex-col items-start gap-1">
                        ${renderKindBadge(item.kind)}
                        <a href="#${item.name}" onclick="event.preventDefault()" class="font-mono text-sm font-semibold text-slate-900 dark:text-white hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                          ${item.name}
                        </a>
                      </div>
                      ${renderCopySelector(item.selector)}
                    </div>
                    ${item.descriptionHtml ? `
                      <p class="mt-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                        ${item.descriptionHtml}
                      </p>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `
      },
      'borderless-minimal': {
        title: '4. Borderless Minimal Stripe',
        desc: 'Drops the enclosing top, right, and bottom box borders entirely, leaving only the 3px left accent stripe and generous vertical rhythm. Ideal when embedding inside an already bordered documentation container.',
        tags: ['Zero box clutter', 'Maximum breathing room', 'Lightweight footprint'],
        render: () => `
          <div class="space-y-6">
            ${apiItems.map(item => {
              const stripeClass = item.kind === 'Component'
                ? 'border-l-sky-500 dark:border-l-sky-400'
                : 'border-l-amber-500 dark:border-l-amber-400';
              return `
                <div class="border-l-[3px] ${stripeClass} pl-4 sm:pl-5 py-0.5">
                  <div class="flex flex-wrap items-start sm:items-center justify-between gap-3">
                    <div class="flex flex-col items-start gap-1">
                      ${renderKindBadge(item.kind)}
                      <a href="#${item.name}" onclick="event.preventDefault()" class="font-mono text-sm font-semibold text-slate-900 dark:text-white hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                        ${item.name}
                      </a>
                    </div>
                    ${renderCopySelector(item.selector)}
                  </div>
                  ${item.descriptionHtml ? `
                    <p class="mt-2.5 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                      ${item.descriptionHtml}
                    </p>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `
      },
      'stacked-selector': {
        title: '5. Left-Aligned Selector Sub-line',
        desc: 'Keeps the 3px left accent stripe and unified card surface while anchoring the copyable selector directly beneath the symbol name. Eliminates wide empty gaps on short names and keeps long selectors aligned in narrow columns.',
        tags: ['Narrow-column safe', 'Natural top-down scan', 'No awkward right gap'],
        render: () => `
          <div class="space-y-3.5">
            ${apiItems.map(item => {
              const stripeClass = item.kind === 'Component'
                ? 'border-l-sky-500 dark:border-l-sky-400'
                : 'border-l-amber-500 dark:border-l-amber-400';
              return `
                <div class="rounded-xl border border-slate-200/90 dark:border-slate-800 border-l-[3px] ${stripeClass} bg-white dark:bg-slate-900/60 px-4 py-3.5 sm:px-5 sm:py-4 transition hover:border-slate-300 dark:hover:border-slate-700">
                  <div class="flex flex-col items-start gap-1">
                    ${renderKindBadge(item.kind)}
                    <a href="#${item.name}" onclick="event.preventDefault()" class="font-mono text-sm font-semibold text-slate-900 dark:text-white hover:text-indigo-600 dark:hover:text-indigo-400 transition">
                      ${item.name}
                    </a>
                  </div>
                  <div class="mt-2 flex flex-wrap items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
                    <span>Used as:</span>
                    ${renderCopySelector(item.selector)}
                  </div>
                  ${item.descriptionHtml ? `
                    <p class="mt-3 pt-3 border-t border-slate-100 dark:border-slate-800/80 text-sm text-slate-600 dark:text-slate-300 leading-relaxed">
                      ${item.descriptionHtml}
                    </p>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        `
      }
    };

    function renderKindBadge(kind) {
      const isComponent = kind === 'Component';
      const textClasses = isComponent
        ? 'text-sky-600 dark:text-sky-400'
        : 'text-amber-600 dark:text-amber-400';
      const dotClasses = isComponent
        ? 'bg-sky-500 dark:bg-sky-400'
        : 'bg-amber-500 dark:bg-amber-400';
      return `
        <span class="inline-flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-widest leading-none ${textClasses}">
          <span class="w-1.5 h-1.5 rounded-full ${dotClasses}"></span>
          ${kind}
        </span>
      `;
    }

    function renderCopySelector(selector) {
      return `
        <button
          onclick="copySelector('${selector}')"
          title="Click to copy selector"
          class="group/btn inline-flex items-center gap-1.5 font-mono text-xs px-2.5 py-1 rounded-md bg-slate-100/90 hover:bg-slate-200/80 dark:bg-slate-800 dark:hover:bg-slate-700/90 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700 transition cursor-pointer max-w-full"
        >
          <span class="truncate">${selector}</span>
          <svg class="w-3.5 h-3.5 shrink-0 text-slate-400 group-hover/btn:text-slate-700 dark:group-hover/btn:text-white transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      `;
    }

    function selectTab(key, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active', 'border-indigo-600', 'text-indigo-600', 'dark:border-indigo-400', 'dark:text-indigo-400');
        btn.classList.add('border-transparent', 'text-slate-500', 'dark:text-slate-400');
      });
      if (btnEl) {
        btnEl.classList.add('active', 'border-indigo-600', 'text-indigo-600', 'dark:border-indigo-400', 'dark:text-indigo-400');
        btnEl.classList.remove('border-transparent', 'text-slate-500', 'dark:text-slate-400');
      }

      const concept = concepts[key];
      document.getElementById('concept-title').textContent = concept.title;
      document.getElementById('concept-desc').textContent = concept.desc;
      document.getElementById('concept-tags').innerHTML = concept.tags.map(tag => `
        <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700/60">
          ${tag}
        </span>
      `).join('');
      document.getElementById('design-stage').innerHTML = concept.render();
    }

    function setWidth(maxWidthClass, btnEl) {
      const container = document.getElementById('preview-container');
      container.classList.remove('max-w-2xl', 'max-w-4xl', 'max-w-5xl');
      container.classList.add(maxWidthClass);

      document.querySelectorAll('.width-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-white', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white', 'shadow-sm');
        btn.classList.add('text-slate-600', 'dark:text-slate-300');
      });
      btnEl.classList.add('active', 'bg-white', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white', 'shadow-sm');
      btnEl.classList.remove('text-slate-600', 'dark:text-slate-300');
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    let toastTimeout;
    function copySelector(text) {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
      } catch (e) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
      }

      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = `Copied "${text}"`;
      toast.classList.remove('translate-y-12', 'opacity-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('translate-y-12', 'opacity-0');
      }, 2000);
    }

    // Initialize first tab on DOM ready
    window.addEventListener('DOMContentLoaded', () => {
      selectTab('clean-crisp', document.querySelector('.tab-btn'));
    });
  </script>
</body>
</html>
