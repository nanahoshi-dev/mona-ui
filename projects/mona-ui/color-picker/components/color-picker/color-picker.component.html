<span class="sr-only">{{ valueText() }}</span>
@if (valueTemplate()) {
    <ng-container
        [ngTemplateOutlet]="valueTemplate() ?? null"
        [ngTemplateOutletContext]="{ $implicit: value() }"></ng-container>
} @else {
    <div [style.background]="value()" [class]="colorClasses()">
        @if (!value()) {
            <svg lucideXCircle [size]="16" aria-hidden="true"></svg>
        }
    </div>
}
<mona-indicator-icon preset="dropdown" [size]="18"></mona-indicator-icon>

<ng-template #popupTemplate>
    @if (view() === "palette") {
        <div
            [id]="popupId"
            [class]="palettePopupClasses"
            tabindex="-1"
            role="dialog"
            [attr.aria-label]="messages().colorPalettePicker"
            data-palette-container>
            @if (showClearButton()) {
                <div class="flex items-center justify-end p-1">
                    <button
                        monaButton
                        look="ghost"
                        size="small"
                        [attr.aria-label]="messages().clearColor"
                        (click)="onClearClick()">
                        <svg lucideDropletOff [size]="16" aria-hidden="true"></svg>
                    </button>
                </div>
            }
            <mona-color-palette
                [clearable]="false"
                [palette]="paletteOption()"
                [columns]="columns()"
                [readonly]="readonly()"
                [tileSize]="tileSize()"
                [value]="value()"
                (valueChange)="onColorPaletteValueChange($event)"
                (colorSelect)="onPaletteColorSelect()"></mona-color-palette>
        </div>
    } @else if (view() === "gradient") {
        <div
            [id]="popupId"
            [class]="gradientPopupClasses"
            tabindex="-1"
            role="dialog"
            [attr.aria-label]="messages().colorGradientPicker">
            <mona-color-gradient
                [format]="format()"
                [opacity]="opacity()"
                [rounded]="rounded()"
                [showButtons]="showButtons()"
                [readonly]="readonly()"
                [value]="value()"
                (valueChange)="onColorGradientValueChange($event)"
                (apply)="onColorGradientApply()"
                (cancel)="onColorGradientCancel()"></mona-color-gradient>
        </div>
    }
</ng-template>
