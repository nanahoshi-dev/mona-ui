@if (checkboxes()) {
    <!-- Visual only: the option row owns selection, so the checkbox is inert (not focusable, clicks reach the row). -->
    <input type="checkbox" [checked]="itemChecked()" monaCheckbox class="aspect-square" inert aria-hidden="true" />
}

@if (template()) {
    <ng-container [ngTemplateOutlet]="template()" [ngTemplateOutletContext]="{ $implicit: dataItem() }"></ng-container>
} @else {
    <span [class]="textClasses()">{{ itemText() }}</span>
}
