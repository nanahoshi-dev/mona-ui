@if (indicatorGeometry(); as geometry) {
    <div
        aria-hidden="true"
        [class]="indicatorClasses()"
        [attr.data-disabled]="selectedOptionDisabled() ? 'true' : null"
        [style.transform]="geometry.transform"
        [style.width.px]="geometry.width"
        [style.height.px]="geometry.height"></div>
}

@for (option of options(); track option.value) {
    @let selected = option.value === value();
    @let optionDisabled = effectiveDisabled() || option.disabled;

    <label
        #optionElement
        [class]="optionClasses()"
        [attr.data-selected]="selected"
        [attr.data-indicator]="geometryReady() || null"
        [attr.data-disabled]="optionDisabled">
        <input
            #radioInput
            type="radio"
            [name]="name() || groupName"
            [value]="option.value"
            [checked]="selected"
            [disabled]="optionDisabled"
            [class]="inputClasses()"
            [attr.aria-label]="itemTemplate() ? option.label : null"
            (change)="onOptionChange(option)"
            (click)="onOptionClick($event)" />

        <span
            class="pointer-events-none flex flex-1 items-center justify-center gap-1
                   [border-radius:inherit]">
            @if (itemTemplate(); as template) {
                <ng-container
                    [ngTemplateOutlet]="template"
                    [ngTemplateOutletContext]="optionContexts()[$index]"></ng-container>
            } @else {
                {{ option.label }}
            }
        </span>
    </label>
}
