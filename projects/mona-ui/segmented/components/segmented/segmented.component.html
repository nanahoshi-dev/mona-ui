@for (option of options(); track option.value) {
    @let selected = option.value === value();
    @let optionDisabled = disabled() || option.disabled;

    <label [class]="optionClasses()" [attr.data-selected]="selected" [attr.data-disabled]="optionDisabled">
        <input
            type="radio"
            [name]="groupName"
            [value]="option.value"
            [checked]="selected"
            [disabled]="optionDisabled"
            [class]="inputClasses()"
            (change)="onOptionChange(option)"
            (blur)="onOptionBlur()" />

        <span
            class="pointer-events-none absolute inset-0 flex items-center justify-center gap-1 rounded-md peer-focus-visible:ring-2 peer-focus-visible:ring-focus-indicator/35">
            {{ option.label }}
        </span>
    </label>
}
