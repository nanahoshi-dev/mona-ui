<button
    monaButton
    (click)="onMainButtonClick($event)"
    (keydown)="onMainButtonKeydown($event)"
    [disabled]="disabled()"
    [iconOnly]="iconOnly()"
    [loading]="loading()"
    [look]="look()"
    [size]="size()"
    [rounded]="rounded()"
    [toggleable]="false"
    class="rounded-e-none"
    [id]="mainButtonId"
    [attr.aria-label]="ariaLabelledby() ? null : ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby() || null"
    #mainButton>
    @if (mainButtonTextTemplate()) {
        <ng-container [ngTemplateOutlet]="mainButtonTextTemplate()"></ng-container>
    } @else {
        <span>{{ text() }}</span>
    }
</button>
<button
    monaButton
    [disabled]="disabled()"
    [iconOnly]="true"
    [look]="look()"
    [size]="size()"
    [rounded]="rounded()"
    [toggleable]="false"
    class="rounded-s-none border-s-0"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-controls]="menuOpen() ? menuId : null"
    [attr.aria-label]="effectiveMenuButtonAriaLabel()"
    #menuButton>
    @if (menuButtonTemplate()) {
        <ng-container [ngTemplateOutlet]="menuButtonTemplate()"></ng-container>
    } @else {
        <svg lucideChevronDown [size]="16"></svg>
    }
</button>

<mona-popup-menu
    [anchorConnectionPoint]="'bottomleft'"
    [anchor]="mainButton"
    [items]="menuItems()"
    (menuClick)="onMenuItemClick($event)"
    (open)="onMenuOpen()"
    (close)="onMenuClose()"
    [offset]="{ horizontal: 0, vertical: 2 }"
    [popupConnectionPoint]="'topleft'"
    [rounded]="popupMenuRounded()"
    [size]="size()"
    [target]="menuButton"
    [trigger]="loading() ? 'none' : 'click'"
    [id]="menuId"
    [minWidth]="popupWidth() || undefined"
    #popupMenu>
    @if (groupTemplate()) {
        <ng-template monaPopupMenuGroupTemplate let-group>
            <ng-container
                [ngTemplateOutlet]="groupTemplate()"
                [ngTemplateOutletContext]="{ $implicit: group }"></ng-container>
        </ng-template>
    }
    @if (iconTemplate()) {
        <ng-template monaPopupMenuIconTemplate let-item>
            <ng-container
                [ngTemplateOutlet]="iconTemplate()"
                [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
        </ng-template>
    }
    @if (shortcutTemplate()) {
        <ng-template monaPopupMenuShortcutTemplate let-item>
            <ng-container
                [ngTemplateOutlet]="shortcutTemplate()"
                [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
        </ng-template>
    }
    @if (textTemplate()) {
        <ng-template monaPopupMenuTextTemplate let-item>
            <ng-container
                [ngTemplateOutlet]="textTemplate()"
                [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
        </ng-template>
    }
</mona-popup-menu>
