<button
    monaButton
    [look]="look()"
    [size]="size()"
    [iconOnly]="iconOnly()"
    [loading]="loading()"
    [rounded]="rounded()"
    [disabled]="disabled()"
    [toggleable]="false"
    aria-haspopup="menu"
    [attr.aria-label]="ariaLabelledby() ? null : ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledby() || null"
    [attr.aria-expanded]="isMenuOpen()"
    [attr.aria-controls]="isMenuOpen() ? menuId : null"
    #dropdownButton>
    @if (textTemplate()) {
        <ng-container
            [ngTemplateOutlet]="textTemplate()"
            [ngTemplateOutletContext]="{ $implicit: text() }"></ng-container>
    } @else {
        {{ text() }}
    }
    @if (showArrow() && !iconOnly()) {
        <svg lucideChevronDown [size]="16" class="shrink-0"></svg>
    }
</button>

<mona-popup-menu
    #popupMenu
    (close)="onMenuClose()"
    (menuClick)="onMenuItemClick($event)"
    (open)="onMenuOpen()"
    [anchorConnectionPoint]="'bottomcenter'"
    [id]="menuId"
    [items]="menuItems()"
    [minWidth]="popupMinWidth()"
    [offset]="{ horizontal: 0, vertical: 2 }"
    [popupConnectionPoint]="'topcenter'"
    [rounded]="popupMenuRounded()"
    [size]="size()"
    [target]="dropdownButton"
    [trigger]="'click'">
    @if (groupTemplate()) {
        <ng-template monaPopupMenuGroupTemplate let-group>
            <ng-container
                [ngTemplateOutlet]="groupTemplate()"
                [ngTemplateOutletContext]="{ $implicit: group }"></ng-container>
        </ng-template>
    }
    @if (menuItemIconTemplate()) {
        <ng-template monaPopupMenuIconTemplate let-item>
            <ng-container
                [ngTemplateOutlet]="menuItemIconTemplate()"
                [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
        </ng-template>
    }
    @if (menuItemShortcutTemplate()) {
        <ng-template monaPopupMenuShortcutTemplate let-item>
            <ng-container
                [ngTemplateOutlet]="menuItemShortcutTemplate()"
                [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
        </ng-template>
    }
    @if (menuItemTextTemplate()) {
        <ng-template monaPopupMenuTextTemplate let-item>
            <ng-container
                [ngTemplateOutlet]="menuItemTextTemplate()"
                [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
        </ng-template>
    }
</mona-popup-menu>
