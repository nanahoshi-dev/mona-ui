<section [class]="sheetClass" (pointerdown)="onPointerDown($event)">
    <span aria-hidden="true" class="mx-auto mt-2 h-1 w-10 shrink-0 rounded-full bg-border"></span>
    <header class="flex shrink-0 items-center gap-3 ps-4 pe-2">
        <span class="min-w-0 flex-1 truncate text-base font-semibold" [id]="data.titleId">{{ data.title() }}</span>
        <button
            monaButton
            type="button"
            look="ghost"
            size="small"
            tabindex="-1"
            class="min-h-11 min-w-11 shrink-0"
            [iconOnly]="true"
            [attr.aria-label]="messages().close"
            (click)="closeSheet()">
            <svg lucideX [size]="16" aria-hidden="true"></svg>
        </button>
    </header>
    <div #content class="flex min-h-0 flex-1 flex-col">
        <ng-container [ngTemplateOutlet]="data.content"></ng-container>
    </div>
</section>
