<mona-text-box
    [aria-describedby]="ariaDescribedBy()"
    [aria-label]="ariaLabel()"
    [aria-labelledby]="ariaLabelledBy()"
    [disabled]="effectiveDisabled()"
    [inputId]="inputId()"
    [readonly]="readonly()"
    [required]="required()"
    [value]="typedInput.text()"
    [inputAttributes]="inputAttributes()"
    [invalid]="invalidState()"
    [placeholder]="placeholder()"
    [rounded]="rounded()"
    [size]="size()"
    [touched]="invalidState() || touched()"
    [clearButton]="showClearButton()"
    (valueChange)="typedInput.edit($event)"
    (inputBlur)="onInputBlur()">
    <ng-template monaTextBoxSuffixTemplate>
        <button
            monaButton
            look="ghost"
            [iconOnly]="true"
            [size]="size()"
            [rounded]="'none'"
            (click)="onTimeInputButtonClick()"
            class="aspect-square h-full w-auto"
            [attr.aria-label]="messages().openTimePicker"
            [attr.aria-expanded]="expanded()"
            [attr.aria-controls]="popupId"
            [disabled]="effectiveDisabled() || readonly()"
            [tabindex]="-1">
            <svg lucideClock [size]="16" aria-hidden="true"></svg>
        </button>
    </ng-template>
</mona-text-box>

<ng-template #timePopupTemplate>
    <div
        [class]="pickerPopupClass()"
        [id]="popupId"
        aria-modal="true"
        role="dialog"
        [attr.aria-label]="messages().timePicker"
        cdkTrapFocus>
        <mona-time-selector
            focusOnMount
            [value]="value()"
            (valueChange)="onTimeSelectorValueChange($event)"
            [max]="max()"
            [min]="min()"
            [disabled]="effectiveDisabled()"
            [readonly]="readonly()"
            [hourFormat]="effectiveHourFormat()"
            [hourStep]="hourStep()"
            [minuteStep]="minuteStep()"
            [secondStep]="secondStep()"
            [size]="size()"
            [rounded]="rounded()"
            [showSeconds]="showSeconds()"></mona-time-selector>
    </div>
</ng-template>
