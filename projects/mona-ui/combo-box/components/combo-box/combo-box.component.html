@if (prefixTemplate()) {
    <span [class]="affixClass()">
        <ng-container [ngTemplateOutlet]="prefixTemplate()"></ng-container>
    </span>
}

<input
    monaTextBox
    [class]="inputClass()"
    [disabled]="effectiveDisabled()"
    [id]="inputId()"
    [placeholder]="placeholder()"
    [readonly]="readonly()"
    [required]="required()"
    [value]="comboBoxValue()"
    [attr.aria-activedescendant]="activeDescendant()"
    [attr.aria-autocomplete]="'list'"
    [attr.aria-busy]="loading()"
    [attr.aria-controls]="listId"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-expanded]="expanded()"
    [attr.aria-haspopup]="'listbox'"
    [attr.aria-invalid]="invalidState() || undefined"
    [attr.aria-label]="ariaLabel() || undefined"
    [attr.aria-labelledby]="labelledBy()"
    [attr.inputmode]="inputMode()"
    role="combobox"
    (click)="onInputClick()"
    (input)="onInput(textInput.value)"
    #textInput />

@if (clearButtonVisible()) {
    <mona-indicator-icon
        preset="clear"
        [interactive]="true"
        [label]="messages().clear"
        (activate)="onValueClear($event)"></mona-indicator-icon>
}

@if (loading()) {
    <mona-indicator-icon preset="loading" [size]="12"></mona-indicator-icon>
}

<mona-indicator-icon preset="dropdown" [size]="18"></mona-indicator-icon>

<ng-template #popupTemplate>
    @if (sheet()) {
        <div [class]="sheetInputContainerClass" (pointerdown)="onPopupPointerDown($event)">
            <input
                monaTextBox
                autocomplete="off"
                data-mona-sheet-autofocus
                role="combobox"
                size="large"
                [class]="sheetInputClass"
                [placeholder]="placeholder()"
                [rounded]="rounded()"
                [value]="comboBoxValue()"
                [attr.aria-activedescendant]="activeDescendant()"
                [attr.aria-autocomplete]="'list'"
                [attr.aria-busy]="loading()"
                [attr.aria-controls]="listId"
                [attr.aria-describedby]="describedBy()"
                [attr.aria-expanded]="true"
                [attr.aria-haspopup]="'listbox'"
                [attr.aria-labelledby]="sheetTitleId()"
                (input)="onInput(sheetInput.value)"
                (keydown)="onSheetKeydown($event)"
                #sheetInput />
        </div>
    }
    <div [class]="listPopupClass()" (pointerdown)="onPopupPointerDown($event)">
        <mona-list (itemSelect)="onItemSelect($event)" [focusOnMount]="false" [size]="listSize()" [listId]="listId">
            @if (footerTemplate()) {
                <ng-template monaListFooterTemplate>
                    <ng-container [ngTemplateOutlet]="footerTemplate()"></ng-container>
                </ng-template>
            }
            @if (groupHeaderTemplate()) {
                <ng-template monaListGroupHeaderTemplate let-group>
                    <ng-container
                        [ngTemplateOutlet]="groupHeaderTemplate()"
                        [ngTemplateOutletContext]="{ $implicit: group }"></ng-container>
                </ng-template>
            }
            @if (headerTemplate()) {
                <ng-template monaListHeaderTemplate>
                    <ng-container [ngTemplateOutlet]="headerTemplate()"></ng-container>
                </ng-template>
            }
            @if (itemTemplate()) {
                <ng-template monaListItemTemplate let-dataItem>
                    <ng-container
                        [ngTemplateOutlet]="itemTemplate()"
                        [ngTemplateOutletContext]="{ $implicit: dataItem }"></ng-container>
                </ng-template>
            }
            @if (noDataTemplate()) {
                <ng-template monaListNoDataTemplate>
                    <ng-container [ngTemplateOutlet]="noDataTemplate()"></ng-container>
                </ng-template>
            }
        </mona-list>
    </div>
</ng-template>
