<mona-text-box
    (inputBlur)="onInputBlur()"
    (valueChange)="typedInput.edit($event)"
    [aria-describedby]="ariaDescribedBy()"
    [aria-label]="ariaLabel()"
    [aria-labelledby]="ariaLabelledBy()"
    [clearButton]="showClearButton()"
    [disabled]="disabled()"
    [inputAttributes]="inputAttributes()"
    [inputId]="inputId()"
    [invalid]="invalidState()"
    [placeholder]="placeholder()"
    [readonly]="readonly()"
    [required]="required()"
    [rounded]="rounded()"
    [size]="size()"
    [touched]="invalidState() || touched()"
    [value]="typedInput.text()">
    @if (prefixTemplate()) {
        <ng-template monaTextBoxPrefixTemplate>
            <ng-container [ngTemplateOutlet]="prefixTemplate()"></ng-container>
        </ng-template>
    }
    <ng-template monaTextBoxSuffixTemplate>
        <button
            monaButton
            look="ghost"
            [iconOnly]="true"
            [size]="size()"
            [rounded]="'none'"
            class="aspect-square h-full w-auto"
            [attr.aria-label]="messages().openDateTimePicker"
            [attr.aria-expanded]="expanded()"
            [attr.aria-controls]="popupId"
            (click)="onDateInputButtonClick()"
            [disabled]="disabled() || readonly()"
            [tabindex]="-1">
            <svg lucideCalendar [size]="16" aria-hidden="true"></svg>
        </button>
    </ng-template>
</mona-text-box>

<ng-template #datePopupTemplate>
    <div
        [class]="pickerPopupClass()"
        [id]="popupId"
        class="flex h-68 flex-col"
        aria-modal="true"
        role="dialog"
        [attr.aria-label]="messages().dateTimePicker"
        cdkTrapFocus>
        <div [class]="headerClass()">
            <div class="flex w-full gap-1" role="tablist" (keydown)="onTabKeydown($event)">
                <button
                    monaButton
                    type="button"
                    role="tab"
                    class="flex-1"
                    [id]="dateTabId"
                    [attr.aria-controls]="panelId"
                    [attr.aria-selected]="activeView() === 'date'"
                    [disabled]="disabled()"
                    [rounded]="rounded()"
                    [selected]="activeView() === 'date'"
                    [size]="size()"
                    [tabindex]="activeView() === 'date' ? 0 : -1"
                    (click)="selectTab('date')">
                    {{ messages().date }}
                </button>
                <button
                    monaButton
                    type="button"
                    role="tab"
                    class="flex-1"
                    [id]="timeTabId"
                    [attr.aria-controls]="panelId"
                    [attr.aria-selected]="activeView() === 'time'"
                    [disabled]="disabled()"
                    [rounded]="rounded()"
                    [selected]="activeView() === 'time'"
                    [size]="size()"
                    [tabindex]="activeView() === 'time' ? 0 : -1"
                    (click)="selectTab('time')">
                    {{ messages().time }}
                </button>
            </div>
        </div>
        <div
            class="overflow-hidden"
            role="tabpanel"
            [id]="panelId"
            [attr.aria-labelledby]="activeView() === 'date' ? dateTabId : timeTabId">
            @if (activeView() === "date") {
                <div class="flex h-full items-center justify-center">
                    <mona-calendar
                        [focusOnMount]="focusViewOnMount()"
                        [disabledDates]="disabledDates()"
                        [minDate]="min()"
                        [maxDate]="max()"
                        [firstDay]="firstDay()"
                        [weekNumber]="weekNumber()"
                        [value]="navigatedDate()"
                        [disabled]="disabled()"
                        [readonly]="readonly()"
                        [rounded]="rounded()"
                        (valueChange)="onCalendarValueChange($event)"
                        class="flex-1 border-none shadow-none">
                        @if (decadeCellTemplate()) {
                            <ng-template monaCalendarDecadeCellTemplate let-year>
                                <ng-container
                                    [ngTemplateOutlet]="decadeCellTemplate()?.templateRef"
                                    [ngTemplateOutletContext]="{ $implicit: year }"></ng-container>
                            </ng-template>
                        }
                        @if (monthCellTemplate()) {
                            <ng-template monaCalendarMonthCellTemplate let-day let-date="date">
                                <ng-container
                                    [ngTemplateOutlet]="monthCellTemplate()?.templateRef"
                                    [ngTemplateOutletContext]="{ $implicit: day, date }"></ng-container>
                            </ng-template>
                        }
                        @if (yearCellTemplate()) {
                            <ng-template monaCalendarYearCellTemplate let-year let-text="text">
                                <ng-container
                                    [ngTemplateOutlet]="yearCellTemplate()?.templateRef"
                                    [ngTemplateOutletContext]="{ $implicit: year, text }"></ng-container>
                            </ng-template>
                        }
                    </mona-calendar>
                </div>
            }
            @if (activeView() === "time") {
                <div class="flex h-full max-h-64 items-center justify-center">
                    <mona-time-selector
                        [focusOnMount]="focusViewOnMount()"
                        [value]="navigatedDate()"
                        (valueChange)="onTimeSelectorValueChange($event)"
                        [disabled]="disabled()"
                        [readonly]="readonly()"
                        [max]="timePickerMax()"
                        [min]="timePickerMin()"
                        [footer]="false"
                        [size]="size()"
                        [rounded]="rounded()"
                        [hourStep]="hourStep()"
                        [minuteStep]="minuteStep()"
                        [secondStep]="secondStep()"
                        [hourFormat]="effectiveHourFormat()"
                        [showSeconds]="showSeconds()"></mona-time-selector>
                </div>
            }
        </div>
        <div [class]="footerClass()">
            <button
                monaButton
                look="primary"
                [disabled]="disabled()"
                [rounded]="rounded()"
                [size]="size()"
                (click)="onSetDateClick()">
                {{ messages().set }}
            </button>
            <button
                monaButton
                look="default"
                [disabled]="disabled()"
                [rounded]="rounded()"
                [size]="size()"
                (click)="onCancelClick()">
                {{ messages().cancel }}
            </button>
        </div>
    </div>
</ng-template>
