<mona-list-view
    [aria-label]="ariaLabel()"
    [aria-labelledby]="ariaLabelledBy()"
    [items]="listBoxItems()"
    [height]="'100%'"
    [rounded]="rounded()"
    [size]="size()"
    [textField]="textField()"
    [width]="'100%'"
    [disabledBy]="disabledBy()"
    [monaListViewNavigable]="{ enabled: true, mode: 'select' }"
    [monaListViewSelectable]="selectableOptions()"
    [selectBy]="selectBy()"
    [selectedKeys]="selectedKeys()"
    (selectedKeysChange)="onSelectedKeysChange()">
    @if (footerTemplate()) {
        <ng-template monaListViewFooterTemplate>
            <ng-container [ngTemplateOutlet]="footerTemplate()"></ng-container>
        </ng-template>
    }
    @if (headerTemplate()) {
        <ng-template monaListViewHeaderTemplate>
            <ng-container [ngTemplateOutlet]="headerTemplate()"></ng-container>
        </ng-template>
    }
    @if (itemTemplate()) {
        <ng-template monaListViewItemTemplate let-dataItem>
            <ng-container
                [ngTemplateOutlet]="itemTemplate()"
                [ngTemplateOutletContext]="{ $implicit: dataItem }"></ng-container>
        </ng-template>
    }
    @if (noDataTemplate()) {
        <ng-template monaListViewNoDataTemplate>
            <ng-container [ngTemplateOutlet]="noDataTemplate()"></ng-container>
        </ng-template>
    }
</mona-list-view>

@let buttons = toolbarButtons();
@if (buttons.length > 0) {
    @let tabStop = toolbarTabStop();
    <div
        role="toolbar"
        [attr.aria-label]="toolbarLabel()"
        [attr.aria-orientation]="toolbarOrientation()"
        [class]="toolbarClasses()"
        (focusin)="onToolbarFocusIn($event)"
        (keydown)="onToolbarKeydown($event)">
        @for (button of buttons; track button.action) {
            <button
                monaButton
                type="button"
                [attr.data-action]="button.action"
                (click)="onActionClick(button.action, $event)"
                [iconOnly]="true"
                [rounded]="rounded()"
                [size]="size()"
                [title]="button.label"
                [attr.aria-label]="button.label"
                [disabled]="!button.enabled"
                [tabindex]="tabStop === button.action ? 0 : -1">
                @switch (button.action) {
                    @case ("moveUp") {
                        <svg lucideChevronUp [size]="16"></svg>
                    }
                    @case ("moveDown") {
                        <svg lucideChevronDown [size]="16"></svg>
                    }
                    @case ("transferFrom") {
                        <svg lucideChevronLeft [size]="16" class="rtl:rotate-180"></svg>
                    }
                    @case ("transferTo") {
                        <svg lucideChevronRight [size]="16" class="rtl:rotate-180"></svg>
                    }
                    @case ("transferAllFrom") {
                        <svg lucideChevronsLeft [size]="16" class="rtl:rotate-180"></svg>
                    }
                    @case ("transferAllTo") {
                        <svg lucideChevronsRight [size]="16" class="rtl:rotate-180"></svg>
                    }
                    @case ("clear") {
                        <svg lucideX [size]="16"></svg>
                    }
                    @case ("remove") {
                        <svg lucideTrash2 [size]="14"></svg>
                    }
                }
            </button>
        }
    </div>
}
