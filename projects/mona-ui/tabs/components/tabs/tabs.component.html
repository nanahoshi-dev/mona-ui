<mona-tab-list
    [aria-label]="ariaLabel()"
    [aria-labelledby]="ariaLabelledBy()"
    [closable]="closable()"
    [disabled]="disabled()"
    [look]="look()"
    [position]="position()"
    [rendersPanels]="true"
    [size]="size()"
    [sortable]="sortable()"
    [tabList]="tabList()"
    [selectedTabId]="selectedTabId()"
    (selectedTabIdChange)="selectedTabId.set($event)"
    (tabClose)="tabClose.emit($event)"
    (tabReorder)="tabReorder.emit($event)"
    (tabSelect)="tabSelect.emit($event)"></mona-tab-list>
<div [class]="contentClass()">
    @for (tab of tabList(); track tab.id) {
        @let selected = tab.id === selectedTabId();
        @let tabLoaded = keepTabContent() || selected;
        @let tabHidden = keepTabContent() && !selected;
        @if (tabLoaded) {
            <div
                class="w-full h-full rounded-sm focus-visible:outline-2 focus-visible:outline-focus-indicator focus-visible:-outline-offset-2"
                [class.hidden]="tabHidden"
                role="tabpanel"
                [id]="panelIdOf(tab)"
                tabindex="0"
                (keydown)="handlePanelKeyDown($event)"
                [attr.aria-hidden]="tabHidden"
                [attr.aria-labelledby]="tab.tabId">
                <ng-container [ngTemplateOutlet]="tab.contentTemplate"></ng-container>
            </div>
        }
    }
</div>
