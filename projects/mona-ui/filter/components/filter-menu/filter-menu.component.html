<div [class]="filterMenuItemClass()">
    <mona-dropdown-list
        [data]="operatorItems()"
        textField="text"
        valueField="value"
        [size]="size()"
        [rounded]="rounded()"
        [aria-label]="messages().operator"
        [ngModel]="selectedFilterMenuDataItemList()[0]"
        (ngModelChange)="onFilterOperatorChange(0, $event)"></mona-dropdown-list>
    @switch (type()) {
        @case ("string") {
            <mona-text-box
                [ngModel]="stringFilterValues()[0]"
                (ngModelChange)="stringFilterValues.set([$event, stringFilterValues()[1]])"
                [size]="size()"
                [rounded]="rounded()"
                [aria-label]="messages().value"
                (keydown)="onValueKeydown($event)"
                [disabled]="selectedFilterMenuDataItemList()[0]?.value | valuelessOperator"></mona-text-box>
        }
        @case ("number") {
            <mona-numeric-text-box
                [ngModel]="numberFilterValues()[0]"
                (ngModelChange)="numberFilterValues.set([$event, numberFilterValues()[1]])"
                [size]="size()"
                [rounded]="rounded()"
                [aria-label]="messages().value"
                (keydown)="onValueKeydown($event)"
                [disabled]="selectedFilterMenuDataItemList()[0]?.value | valuelessOperator"></mona-numeric-text-box>
        }
        @case ("date") {
            <mona-date-picker
                [ngModel]="dateFilterValues()[0]"
                (ngModelChange)="dateFilterValues.set([$event, dateFilterValues()[1]])"
                [format]="dateOptions().format ?? null"
                [size]="size()"
                [rounded]="rounded()"
                [aria-label]="messages().value"
                (keydown)="onValueKeydown($event)"
                [disabled]="selectedFilterMenuDataItemList()[0]?.value | valuelessOperator"></mona-date-picker>
        }
    }
</div>
@if (firstFilterValid()) {
    <div [class]="filterMenuItemClass()">
        <mona-button-group
            selection="single"
            [size]="size()"
            [rounded]="rounded()"
            [aria-label]="messages().logic"
            [disabled]="!firstFilterValid()">
            @for (item of connectorDataItems(); track item.value) {
                <button
                    monaButton
                    [selected]="item.value === selectedConnectorItem()?.value"
                    (selectedChange)="onConnectorChange(item, $event)">
                    {{ item.text }}
                </button>
            }
        </mona-button-group>
    </div>
}
@if (!!selectedConnectorItem()) {
    <div [class]="filterMenuItemClass()">
        <mona-dropdown-list
            [data]="operatorItems()"
            textField="text"
            valueField="value"
            [size]="size()"
            [rounded]="rounded()"
            [aria-label]="messages().secondOperator"
            [ngModel]="selectedFilterMenuDataItemList()[1]"
            (ngModelChange)="onFilterOperatorChange(1, $event)"></mona-dropdown-list>
        @switch (type()) {
            @case ("string") {
                <mona-text-box
                    [ngModel]="stringFilterValues()[1]"
                    (ngModelChange)="stringFilterValues.set([stringFilterValues()[0], $event])"
                    [size]="size()"
                    [rounded]="rounded()"
                    [aria-label]="messages().secondValue"
                    (keydown)="onValueKeydown($event)"
                    [disabled]="selectedFilterMenuDataItemList()[1]?.value | valuelessOperator"></mona-text-box>
            }
            @case ("number") {
                <mona-numeric-text-box
                    [ngModel]="numberFilterValues()[1]"
                    (ngModelChange)="numberFilterValues.set([numberFilterValues()[0], $event])"
                    [size]="size()"
                    [rounded]="rounded()"
                    [aria-label]="messages().secondValue"
                    (keydown)="onValueKeydown($event)"
                    [disabled]="selectedFilterMenuDataItemList()[1]?.value | valuelessOperator"></mona-numeric-text-box>
            }
            @case ("date") {
                <mona-date-picker
                    [ngModel]="dateFilterValues()[1]"
                    (ngModelChange)="dateFilterValues.set([dateFilterValues()[0], $event])"
                    [format]="dateOptions().format ?? null"
                    [size]="size()"
                    [rounded]="rounded()"
                    [aria-label]="messages().secondValue"
                    (keydown)="onValueKeydown($event)"
                    [disabled]="selectedFilterMenuDataItemList()[1]?.value | valuelessOperator"></mona-date-picker>
            }
        }
    </div>
}
<div [class]="`${filterMenuItemClass()} ${filterMenuActionsClass()}`">
    <button
        monaButton
        (click)="onFilterApply()"
        [look]="'primary'"
        [size]="size()"
        [rounded]="rounded()"
        [disabled]="applyDisabled()">
        {{ messages().apply }}
    </button>
    <button monaButton (click)="onFilterClear()" [look]="'default'" [size]="size()" [rounded]="rounded()">
        {{ messages().clear }}
    </button>
</div>
