<label
    [class]="containerLabelClasses()"
    [attr.data-disabled]="effectiveDisabled()"
    [attr.data-readonly]="effectiveReadonly() || null">
    @if (labelPosition() === "before") {
        <ng-container [ngTemplateOutlet]="labelTemplate"></ng-container>
    }
    <input
        #input
        type="radio"
        [id]="inputId()"
        [required]="effectiveRequired()"
        [disabled]="effectiveDisabled()"
        [name]="effectiveName()"
        [attr.value]="nativeValue()"
        [class]="radioButtonClasses()"
        [checked]="selected()"
        [attr.aria-invalid]="inputInvalid() ? 'true' : null"
        [attr.aria-label]="ariaLabel() || null"
        [attr.aria-labelledby]="labelledBy()"
        [attr.aria-describedby]="ariaDescribedBy() || null"
        (blur)="onBlur($event)"
        (click)="onInputClick($event)"
        (focus)="inputFocus.emit($event)"
        (change)="onSelectionChange()" />
    <span [class]="radioButtonCircleClasses()" [attr.data-invalid]="invalidState() || null">
        @if (selected()) {
            <span [class]="radioButtonIndicatorClasses()"></span>
        }
    </span>
    @if (labelPosition() === "after") {
        <ng-container [ngTemplateOutlet]="labelTemplate"></ng-container>
    }
</label>

<ng-template #labelTemplate>
    @if (label()) {
        <span>{{ label() }}</span>
    } @else {
        <ng-content></ng-content>
    }
</ng-template>
