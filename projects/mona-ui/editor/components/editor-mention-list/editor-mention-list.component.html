<div [class]="listClass">
    @if (options().length > 0) {
        <ul
            role="listbox"
            class="m-0 list-none p-0"
            [id]="mention.listId"
            [attr.aria-label]="messages().mentionSuggestions">
            @for (option of options(); track option.id) {
                <li
                    role="option"
                    [id]="option.id"
                    [class]="option.class"
                    [attr.aria-selected]="option.highlighted"
                    (click)="onOptionClick(option.index)"
                    (pointerdown)="onOptionPointerDown($event)"
                    (pointerenter)="onOptionPointerEnter(option.index)">
                    {{ option.label }}
                </li>
            }
        </ul>
    } @else if (mention.loading()) {
        <div [class]="statusClass">{{ messages().mentionSearching }}</div>
    } @else {
        <div [class]="statusClass">{{ messages().mentionNoResults }}</div>
    }
</div>
