<mona-button-group selection="single" [size]="'small'">
    <button monaButton [disabled]="undoDisabled()" (click)="onUndoClick()" [title]="messages().undo">
        <i class="ri-arrow-go-back-line"></i>
    </button>
    <button monaButton [disabled]="redoDisabled()" (click)="onRedoClick()" [title]="messages().redo">
        <i class="ri-arrow-go-forward-line"></i>
    </button>
</mona-button-group>
