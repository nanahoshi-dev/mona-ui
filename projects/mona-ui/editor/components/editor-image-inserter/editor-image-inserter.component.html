<form [formRoot]="iForm" [class]="formClass()">
    <div [class]="rowClass()">
        <label [class]="rowLabelClass()" [id]="labelIds.link">{{ messages().imageUrl }}</label>
        <mona-text-box [size]="'small'" [formField]="iForm.link" [aria-labelledby]="labelIds.link"></mona-text-box>
    </div>
    <div [class]="rowClass()">
        <label [class]="rowLabelClass()" [id]="labelIds.alt">{{ messages().altText }}</label>
        <mona-text-box [size]="'small'" [formField]="iForm.alt" [aria-labelledby]="labelIds.alt"></mona-text-box>
    </div>
    <div class="flex gap-2">
        <div [class]="rowClass()">
            <label [class]="rowLabelClass()" [id]="labelIds.width">{{ messages().widthPx }}</label>
            <mona-numeric-text-box
                [size]="'small'"
                [formField]="iForm.width"
                [aria-labelledby]="labelIds.width"></mona-numeric-text-box>
        </div>
        <div [class]="rowClass()">
            <label [class]="rowLabelClass()" [id]="labelIds.height">{{ messages().heightPx }}</label>
            <mona-numeric-text-box
                [size]="'small'"
                [formField]="iForm.height"
                [aria-labelledby]="labelIds.height"></mona-numeric-text-box>
        </div>
    </div>
    <div [class]="actionsClass()">
        <button monaButton [size]="'small'" [disabled]="!iForm().valid()" look="primary" (click)="onImageInsert()">
            {{ messages().insert }}
        </button>
        <button monaButton [size]="'small'" [look]="'secondary'" (click)="onCancel()">{{ messages().cancel }}</button>
    </div>
</form>
