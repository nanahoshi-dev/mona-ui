<mona-button-group selection="single" [size]="'small'">
    <button
        monaButton
        [selected]="linkSelected()"
        [toggleable]="false"
        (click)="onLinkDialogDisplay()"
        [title]="messages().insertLink">
        <i class="ri-link-m"></i>
    </button>
    <button monaButton [disabled]="unlinkDisabled()" (click)="onUnlinkClick()" [title]="messages().removeLink">
        <i class="ri-link-unlink-m"></i>
    </button>
</mona-button-group>
