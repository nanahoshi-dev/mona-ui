@if (anyToolVisible()) {
    <mona-button-group selection="multiple" [size]="'small'">
        @if (boldVisible()) {
            <button
                monaButton
                [selected]="boldSelected()"
                [toggleable]="false"
                (click)="onBoldToggle()"
                [title]="messages().bold">
                <i class="ri-bold"></i>
            </button>
        }
        @if (italicVisible()) {
            <button
                monaButton
                [selected]="italicSelected()"
                [toggleable]="false"
                (click)="onItalicToggle()"
                [title]="messages().italic">
                <i class="ri-italic"></i>
            </button>
        }
        @if (underlineVisible()) {
            <button
                monaButton
                [selected]="underlineSelected()"
                [toggleable]="false"
                (click)="onUnderlineToggle()"
                [title]="messages().underline">
                <i class="ri-underline"></i>
            </button>
        }
        @if (strikeThroughVisible()) {
            <button
                monaButton
                [selected]="strikeThroughSelected()"
                [toggleable]="false"
                (click)="onStrikeThroughToggle()"
                [title]="messages().strikethrough">
                <i class="ri-strikethrough"></i>
            </button>
        }
        @if (subscriptVisible()) {
            <button
                monaButton
                [selected]="subscriptSelected()"
                [toggleable]="false"
                (click)="onSubscriptToggle()"
                [title]="messages().subscript">
                <i class="ri-subscript"></i>
            </button>
        }
        @if (superscriptVisible()) {
            <button
                monaButton
                [selected]="superscriptSelected()"
                [toggleable]="false"
                (click)="onSuperscriptToggle()"
                [title]="messages().superscript">
                <i class="ri-superscript"></i>
            </button>
        }
    </mona-button-group>
}
