<mona-button-group selection="single" [size]="'small'" [aria-label]="messages().alignmentGroup">
    <button
        monaButton
        [selected]="alignStartSelected()"
        [monaEditorPressed]="alignStartSelected()"
        [toggleable]="false"
        (click)="onAlignStart()"
        [title]="messages().alignStart">
        <i [class]="startIcon()"></i>
    </button>
    <button
        monaButton
        [selected]="alignCenterSelected()"
        [monaEditorPressed]="alignCenterSelected()"
        [toggleable]="false"
        (click)="onAlignCenter()"
        [title]="messages().alignCenter">
        <i class="ri-align-center"></i>
    </button>
    <button
        monaButton
        [selected]="alignEndSelected()"
        [monaEditorPressed]="alignEndSelected()"
        [toggleable]="false"
        (click)="onAlignEnd()"
        [title]="messages().alignEnd">
        <i [class]="endIcon()"></i>
    </button>
    <button
        monaButton
        [selected]="alignJustifySelected()"
        [monaEditorPressed]="alignJustifySelected()"
        [toggleable]="false"
        (click)="onAlignJustify()"
        [title]="messages().justify">
        <i class="ri-align-justify"></i>
    </button>
</mona-button-group>
