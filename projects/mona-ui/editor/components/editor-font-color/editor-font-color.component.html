<mona-color-picker
    view="gradient"
    [size]="'small'"
    [value]="selectedColor()"
    (valueChange)="onColorChange($event)"
    [aria-label]="messages().color"
    [title]="messages().color">
    <ng-template monaColorPickerValueTemplate let-color>
        <div [class]="colorValueClass()">
            <i class="ri-font-family"></i>
            <span [class]="colorPreviewClass()" [style.background-color]="color || 'currentColor'"></span>
        </div>
    </ng-template>
</mona-color-picker>
