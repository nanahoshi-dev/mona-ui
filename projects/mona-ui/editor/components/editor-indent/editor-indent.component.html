<mona-button-group selection="single" [size]="'small'">
    <button monaButton [disabled]="indentDisabled()" (click)="onIndentClick()" [title]="messages().indent">
        <i class="ri-indent-increase"></i>
    </button>
    <button monaButton [disabled]="outdentDisabled()" (click)="onOutdentClick()" [title]="messages().outdent">
        <i class="ri-indent-decrease"></i>
    </button>
</mona-button-group>
