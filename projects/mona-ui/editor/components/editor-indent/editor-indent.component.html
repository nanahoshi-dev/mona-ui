<mona-button-group selection="single" [size]="'small'" [aria-label]="messages().indentGroup">
    <button
        monaButton
        [toggleable]="false"
        [disabled]="indentDisabled()"
        (click)="onIndentClick()"
        [title]="messages().indent">
        <i class="ri-indent-increase"></i>
    </button>
    <button
        monaButton
        [toggleable]="false"
        [disabled]="outdentDisabled()"
        (click)="onOutdentClick()"
        [title]="messages().outdent">
        <i class="ri-indent-decrease"></i>
    </button>
</mona-button-group>
