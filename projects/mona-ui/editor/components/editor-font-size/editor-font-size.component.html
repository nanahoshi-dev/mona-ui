<mona-dropdown-list
    [data]="editorService.fontSizes()"
    [placeholder]="messages().fontSize"
    [aria-label]="messages().selectFontSize"
    [value]="selectedFontSize()"
    (valueChange)="onFontSizeChange($event)"
    [size]="'small'"
    [class]="dropdownListClass()"
    [title]="messages().selectFontSize"></mona-dropdown-list>
