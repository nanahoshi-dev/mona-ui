<div role="group" [attr.aria-label]="messages().insertTable" (keydown)="onKeydown($event)">
    <div [class]="tableCreatorClass()">
        @for (cell of cells; track $index) {
            <button
                type="button"
                [class]="tableCreatorCellClass()"
                [attr.data-highlighted]="isHighlighted(cell) || null"
                [attr.tabindex]="isTabStop(cell) ? 0 : -1"
                [attr.aria-label]="messages().tableSize(cell.row, cell.col)"
                (click)="onCellClick(cell)"
                (focus)="onCellFocus(cell)"
                (pointerenter)="onCellPointerEnter(cell)"></button>
        }
    </div>
    <p class="m-0 px-1 pb-1 text-center text-sm" aria-live="polite">
        {{ messages().tableSize(highlighted().row, highlighted().col) }}
    </p>
</div>
