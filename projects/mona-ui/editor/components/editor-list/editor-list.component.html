<mona-button-group selection="single" [size]="'small'" [aria-label]="messages().listGroup">
    <button
        monaButton
        [selected]="unorderedListSelected()"
        [monaEditorPressed]="unorderedListSelected()"
        [toggleable]="false"
        (click)="onUnorderedListToggle()"
        [title]="messages().insertUnorderedList">
        <i class="ri-list-unordered"></i>
    </button>
    <button
        monaButton
        [selected]="orderedListSelected()"
        [monaEditorPressed]="orderedListSelected()"
        [toggleable]="false"
        (click)="onOrderedListToggle()"
        [title]="messages().insertOrderedList">
        <i class="ri-list-ordered-2"></i>
    </button>
</mona-button-group>
