<button
    monaButton
    [size]="'small'"
    aria-haspopup="dialog"
    (click)="onDisplayInserterClick()"
    [title]="messages().insertImage">
    <i class="ri-image-add-line"></i>
</button>

@if (inserterVisible()) {
    <mona-window
        [width]="400"
        [modal]="true"
        [title]="messages().insertImage"
        [minimizable]="false"
        [maximizable]="false"
        (close)="onInserterClose()">
        <ng-template monaWindowContentTemplate>
            <mona-editor-image-inserter
                (insert)="onImageInsert($event)"
                (insertCancel)="onInsertCancel()"></mona-editor-image-inserter>
        </ng-template>
    </mona-window>
}
