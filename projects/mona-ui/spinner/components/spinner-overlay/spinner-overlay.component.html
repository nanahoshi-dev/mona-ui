<div class="flex flex-col items-center justify-center gap-2.5 p-4 text-sm font-medium text-foreground text-center">
    <mona-spinner [appearance]="appearance()" [size]="size()" [decorative]="true"></mona-spinner>

    @if (text()) {
        <span class="max-w-xs wrap-anywhere">{{ text() }}</span>
    } @else {
        <span class="sr-only">{{ messages().loading }}</span>
    }

    @if (cancellable()) {
        <button
            type="button"
            (click)="onCancel()"
            class="mt-1 inline-flex items-center justify-center rounded-md border border-border bg-background px-2.5 py-1 text-xs font-medium text-foreground shadow-xs hover:bg-accent hover:text-accent-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus-indicator cursor-pointer transition-colors"
        >
            {{ effectiveCancelText() }}
        </button>
    }
</div>
