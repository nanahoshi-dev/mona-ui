@for (prefixTemplate of prefixTemplateList(); track $index) {
    <span class="flex h-full flex-none flex-wrap items-center overflow-hidden border-none">
        <ng-container *ngTemplateOutlet="prefixTemplate"></ng-container>
    </span>
}
<input
    monaTextBox
    [id]="inputId()"
    [disabled]="effectiveDisabled()"
    [required]="required()"
    [type]="'text'"
    [attr.inputmode]="decimals() > 0 ? 'decimal' : 'numeric'"
    [readonly]="readonly()"
    [tabIndex]="tabindex()"
    [placeholder]="placeholder()"
    [value]="formattedValue()"
    (input)="applyRawValue(valueTextBox.value)"
    (keydown)="keydown$.next($event)"
    (focus)="inputFocus.emit($event)"
    (focusout)="inputFocusOut.emit($event)"
    (beforeinput)="beforeInput$.next($event)"
    (paste)="onPaste($event)"
    (wheel)="wheel$.next($event)"
    [size]="size()"
    [class]="inputClasses()"
    autocomplete="off"
    role="spinbutton"
    [attr.aria-describedby]="ariaDescribedBy() || null"
    [attr.aria-invalid]="invalidInput() || null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
    [attr.aria-valuenow]="value()"
    [attr.aria-valuemin]="minValue()"
    [attr.aria-valuemax]="maxValue()"
    [attr.aria-valuetext]="formattedValue() || null"
    [attr.data-spinners]="showSpinners()"
    #valueTextBox />
@if (showSpinners()) {
    <div [class]="spinButtonClasses()">
        <button
            monaButton
            [disabled]="effectiveDisabled()"
            [tabindex]="-1"
            look="ghost"
            [size]="size()"
            (mousedown)="$event.preventDefault()"
            (pointerdown)="onSpinPointerDown($event, '+')"
            (pointerup)="spinStop$.next()"
            (pointerleave)="spinStop$.next()"
            [attr.aria-label]="messages().increase">
            <svg lucideChevronUp [size]="spinButtonIconSize()"></svg>
        </button>
        <button
            monaButton
            [disabled]="effectiveDisabled()"
            [tabindex]="-1"
            look="ghost"
            [size]="size()"
            (mousedown)="$event.preventDefault()"
            (pointerdown)="onSpinPointerDown($event, '-')"
            (pointerup)="spinStop$.next()"
            (pointerleave)="spinStop$.next()"
            [attr.aria-label]="messages().decrease">
            <svg lucideChevronDown [size]="spinButtonIconSize()"></svg>
        </button>
    </div>
}
