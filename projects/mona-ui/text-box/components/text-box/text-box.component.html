@for (prefixTemplate of prefixTemplateList(); track $index) {
    <span class="flex h-full flex-wrap items-center">
        <ng-container *ngTemplateOutlet="prefixTemplate"></ng-container>
    </span>
}
<input
    [id]="inputId()"
    [disabled]="effectiveDisabled()"
    [readonly]="readonly()"
    [required]="required()"
    [placeholder]="placeholder()"
    [type]="type()"
    [class]="inputClass()"
    [style]="inputStyle()"
    [attr.aria-describedby]="ariaDescribedBy() || null"
    [attr.aria-invalid]="invalidInput() ? 'true' : null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-labelledby]="ariaLabelledBy() || null"
    [attr.maxlength]="maxLength() ?? null"
    [attr.minlength]="minLength() ?? null"
    [attr.name]="name() || null"
    [monaAttributeBinder]="inputAttributes()"
    [value]="value()"
    (input)="onValueChange(input.value)"
    (blur)="onInputBlur($event)"
    (focus)="inputFocus.emit($event)"
    #input />

@if (showClearButton()) {
    <button
        monaButton
        look="ghost"
        size="small"
        class="me-1 size-6 shrink-0 p-0 text-muted-foreground hover:text-foreground"
        [attr.aria-label]="messages().clear"
        (click)="onClearClick()">
        <svg lucideX class="size-4"></svg>
    </button>
}

@for (suffixTemplate of suffixTemplateList(); track $index) {
    <span class="flex h-full flex-wrap items-center">
        <ng-container *ngTemplateOutlet="suffixTemplate"></ng-container>
    </span>
}
