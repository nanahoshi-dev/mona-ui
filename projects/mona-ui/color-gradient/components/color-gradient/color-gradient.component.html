<div [class]="hsvRectangleClasses()" [style.background-color]="hsvRectangleBackground()" #hsvRectangle>
    <div
        [class]="hsvRectangleHandleClasses()"
        [style.left.%]="hsv().s ?? 0"
        [style.top.%]="100 - (hsv().v ?? 100)"
        [attr.tabindex]="effectiveDisabled() ? -1 : 0"
        [attr.role]="'slider'"
        [attr.aria-label]="messages().saturationAndValue"
        [attr.aria-valuemin]="0"
        [attr.aria-valuemax]="100"
        [attr.aria-valuenow]="roundedSaturation()"
        [attr.aria-valuetext]="messages().saturationAndValueText(roundedSaturation(), roundedValue())"
        [attr.aria-disabled]="effectiveDisabled() || null"
        [attr.aria-readonly]="readonly() || null"
        (keydown)="onHsvHandleKeyDown($event)"
        #hsvPointer></div>
</div>
<div class="flex items-center gap-2">
    <div class="flex flex-1 flex-col gap-1 me-2 forced-color-adjust-none">
        <mona-slider
            dir="ltr"
            [aria-label]="messages().hue"
            [minValue]="0"
            [maxValue]="360"
            [trackBackground]="'linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000)'"
            [selectionBackground]="'transparent'"
            [handleClasses]="sliderHandleClasses()"
            [trackSize]="sliderHeight"
            [rounded]="rounded()"
            [value]="roundedHue()"
            [disabled]="effectiveDisabled()"
            [readonly]="readonly()"
            (valueChange)="onHueChange($event)"></mona-slider>
        @if (opacity()) {
            <mona-slider
                dir="ltr"
                [aria-label]="messages().alpha"
                [ariaValueText]="alphaValueText()"
                [minValue]="0"
                [maxValue]="255"
                [trackBackground]="alphaSliderBackground()"
                [selectionBackground]="'transparent'"
                [handleClasses]="sliderHandleClasses()"
                [trackSize]="sliderHeight"
                [rounded]="rounded()"
                [value]="alpha()"
                [disabled]="effectiveDisabled()"
                [readonly]="readonly()"
                (valueChange)="onAlphaChange($event)"></mona-slider>
        }
    </div>
    @for (preview of colorPreviews(); track preview.type) {
        <div
            [class]="colorPreviewClasses()"
            [class.cursor-pointer]="$index === 1"
            [style.background-color]="preview.color"
            [attr.title]="$index === 1 ? preview.title : null"
            [attr.aria-label]="$index === 1 ? preview.title : null"
            [attr.aria-hidden]="$index === 0 ? 'true' : null"
            [attr.aria-disabled]="$index === 1 && interactionDisabled() ? 'true' : null"
            [attr.role]="$index === 1 ? 'button' : null"
            [attr.tabindex]="$index === 1 && !interactionDisabled() ? 0 : null"
            (click)="preview.onClick?.()"
            (keydown)="onPreviousColorKeyDown($event, preview.onClick)"></div>
    }
    <button
        monaButton
        look="ghost"
        size="small"
        [disabled]="interactionDisabled()"
        [attr.aria-label]="messages().clearColor"
        (click)="onClearClick()">
        <svg lucideDropletOff [size]="16" aria-hidden="true"></svg>
    </button>
</div>
<div class="flex flex-col gap-2">
    @if (showColorInputs()) {
        <div class="flex gap-2">
            <div class="flex gap-1">
                @for (input of colorInputs(); track input.key) {
                    <mona-numeric-text-box
                        [aria-label]="input.ariaLabel"
                        [value]="input.value"
                        [minValue]="input.min"
                        [maxValue]="input.max"
                        [decimals]="0"
                        [spinners]="false"
                        [nullable]="false"
                        [rounded]="rounded()"
                        [size]="'small'"
                        class="w-18"
                        [disabled]="effectiveDisabled()"
                        [readonly]="readonly()"
                        (valueChange)="input.change($event)">
                        <ng-template monaNumericTextBoxPrefixTemplate>
                            <ng-container
                                [ngTemplateOutlet]="numericInputPrefixTemplate"
                                [ngTemplateOutletContext]="{ $implicit: input.label }"></ng-container>
                        </ng-template>
                    </mona-numeric-text-box>
                }
            </div>
            <div class="flex flex-1 items-center justify-end">
                <button
                    monaButton
                    look="ghost"
                    [rounded]="rounded()"
                    size="small"
                    [disabled]="effectiveDisabled()"
                    [attr.aria-label]="messages().switchColorMode"
                    (click)="onSwitchColorModeClick()">
                    <svg lucideChevronsUpDown [size]="16" aria-hidden="true"></svg>
                </button>
            </div>
        </div>
    }
    @if (showHexInput()) {
        <mona-text-box
            [aria-label]="messages().hexColor"
            [rounded]="rounded()"
            [value]="hex()"
            [disabled]="effectiveDisabled()"
            [readonly]="readonly()"
            (valueChange)="onHexChange($event)"
            (inputBlur)="onHexInputBlur()"
            (inputFocus)="onHexInputFocus()"
            class="w-full">
            <ng-template monaTextBoxPrefixTemplate>
                <ng-container
                    [ngTemplateOutlet]="numericInputPrefixTemplate"
                    [ngTemplateOutletContext]="{ $implicit: 'HEX', classes: 'w-auto px-2' }"></ng-container>
            </ng-template>
            <ng-template monaTextBoxSuffixTemplate>
                <mona-dropdown-button
                    look="ghost"
                    [disabled]="effectiveDisabled() || !selectedColor()"
                    [iconOnly]="true"
                    [aria-label]="messages().copyColor"
                    class="h-full">
                    <ng-template monaDropdownButtonTextTemplate>
                        <svg lucideCopy [size]="12" aria-hidden="true"></svg>
                    </ng-template>
                    <mona-dropdown-button-item
                        [label]="messages().copyAsHex"
                        (menuClick)="onCopyColorSelect('hex')"></mona-dropdown-button-item>
                    <mona-dropdown-button-item
                        [label]="messages().copyAsRgb"
                        (menuClick)="onCopyColorSelect('rgb')"></mona-dropdown-button-item>
                </mona-dropdown-button>
            </ng-template>
        </mona-text-box>
    }
    @if (showButtons()) {
        <div class="flex items-center justify-end gap-2">
            <button
                monaButton
                [rounded]="rounded()"
                look="primary"
                [disabled]="interactionDisabled()"
                (click)="onApply()">
                {{ messages().apply }}
            </button>
            <button monaButton [rounded]="rounded()" [disabled]="effectiveDisabled()" (click)="onCancel()">
                {{ messages().cancel }}
            </button>
        </div>
    }
</div>

<ng-template #numericInputPrefixTemplate let-text let-classes="classes">
    <span
        [class]="classes"
        class="inline-flex items-center justify-center select-none w-7.5 [background-color:var(--mona-input-addon-background,var(--color-secondary))] h-full text-foreground text-xs font-semibold border-e border-e-input-border"
        aria-hidden="true"
        >{{ text }}</span
    >
</ng-template>
