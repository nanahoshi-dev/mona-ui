@if (column().commandTemplate) {
    <ng-container
        [ngTemplateOutlet]="column().commandTemplate"
        [ngTemplateOutletContext]="commandContext()"></ng-container>
} @else {
    <div class="flex h-full items-center gap-1 px-1">
        @if (isEditing()) {
            @if (hasRowError()) {
                <span class="shrink-0 px-1 text-error" #rowErrorIcon>
                    <svg lucideOctagonAlert [size]="14"></svg>
                </span>
                <mona-tooltip [target]="rowErrorIcon">
                    <span class="p-1 whitespace-pre-line">{{ rowErrorTooltip() }}</span>
                </mona-tooltip>
            }
            <button
                monaButton
                look="ghost"
                size="small"
                [iconOnly]="true"
                [attr.aria-label]="messages().saveRow"
                [attr.title]="messages().save"
                class="w-6 h-6"
                [tabindex]="-1"
                (click)="save($event)">
                <svg lucideCheck [size]="14"></svg>
            </button>
            <button
                monaButton
                look="ghost"
                size="small"
                [iconOnly]="true"
                [attr.aria-label]="messages().cancelRowEdit"
                [attr.title]="messages().cancel"
                class="w-6 h-6"
                [tabindex]="-1"
                (click)="cancel($event)">
                <svg lucideX [size]="14"></svg>
            </button>
        } @else {
            @if (canEditRows()) {
                <button
                    monaButton
                    look="ghost"
                    size="small"
                    [iconOnly]="true"
                    [attr.aria-label]="messages().editRow"
                    [attr.title]="messages().edit"
                    class="w-6 h-6"
                    [tabindex]="-1"
                    (click)="edit($event)">
                    <svg lucidePencil [size]="14"></svg>
                </button>
            }
            <button
                monaButton
                look="ghost"
                size="small"
                [iconOnly]="true"
                [attr.aria-label]="messages().removeRow"
                [attr.title]="messages().remove"
                class="w-6 h-6"
                [tabindex]="-1"
                (click)="remove($event)">
                <svg lucideTrash2 [size]="14"></svg>
            </button>
        }
    </div>
}
