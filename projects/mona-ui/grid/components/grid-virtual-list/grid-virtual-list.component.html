@if (gridService.addRowVisible()) {
    <div
        class="shrink-0 overflow-hidden border-b border-b-border"
        [style.margin-inline-end.px]="gridService.scrollbarGutterWidth()"
        #addRowScrollElement>
        <table role="presentation" [class]="tableClass()" [style.width.px]="gridService.tableWidth()">
            <colgroup monaGridColgroup></colgroup>
            <tbody role="rowgroup">
                <tr monaGridAddRow></tr>
            </tbody>
        </table>
    </div>
}

<cdk-virtual-scroll-viewport
    class="flex-1 min-h-0"
    [itemSize]="gridService.virtualScrollOptions().height"
    [minBufferPx]="gridService.virtualGridMinBuffer()"
    [maxBufferPx]="gridService.virtualGridMaxBuffer()">
    <table role="presentation" #bodyTable [class]="tableClass()" [style.width.px]="gridService.tableWidth()">
        <colgroup monaGridColgroup></colgroup>
        <tbody role="rowgroup" tabindex="0" (focus)="onViewportFocus()">
            <ng-container *cdkVirtualFor="let bodyRow of bodyRows(); let rowIndex = index; trackBy: trackBodyRow">
                @if (bodyRow.type === "group") {
                    <tr monaGridGroupRow [group]="bodyRow" [rowIndex]="rowIndex"></tr>
                } @else if (bodyRow.type === "groupFooter") {
                    <tr monaGridFooterRow [groupKey]="bodyRow.groupAggregate.groupKey"></tr>
                } @else {
                    <tr monaGridRow [row]="bodyRow.row" [index]="rowIndex"></tr>
                    @if (gridService.isRowExpanded(bodyRow.row) && !gridService.rowDragInProgress()) {
                        <tr monaGridDetailRow [row]="bodyRow.row"></tr>
                    }
                }
            </ng-container>
        </tbody>
    </table>
</cdk-virtual-scroll-viewport>

@if (gridService.hasFooter()) {
    <div [class]="footerClass()" [style.margin-inline-end.px]="gridService.scrollbarGutterWidth()" #footerScrollElement>
        <div>
            <table role="presentation" [class]="footerTableClass()" [style.width.px]="gridService.tableWidth()">
                <colgroup monaGridColgroup></colgroup>
                <tfoot role="rowgroup">
                    <tr monaGridFooterRow></tr>
                </tfoot>
            </table>
        </div>
    </div>
}
