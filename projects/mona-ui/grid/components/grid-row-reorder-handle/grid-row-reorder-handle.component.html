<button
    type="button"
    cdkDragHandle
    [class]="handleClass()"
    [disabled]="disabled()"
    [attr.title]="disabledReasonText()"
    [attr.aria-label]="ariaLabel()"
    aria-keyshortcuts="Alt+ArrowUp Alt+ArrowDown"
    (keydown)="onKeydown($event)">
    <i aria-hidden="true" class="ri-draggable"></i>
</button>
