<button
    monaButton
    look="ghost"
    [rounded]="'none'"
    [iconOnly]="true"
    (click)="openPopup()"
    class="overflow-hidden w-5 h-5"
    size="small"
    [tabindex]="-1"
    [attr.aria-label]="messages().filterByColumn(column().title)"
    [class.text-info]="column().filtered">
    <svg lucideFunnel [size]="12"></svg>
</button>
