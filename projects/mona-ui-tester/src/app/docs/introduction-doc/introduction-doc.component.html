<app-markdown-doc src="docs/introduction/intro.md"></app-markdown-doc>

<!-- Tech Stack Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4 my-6">
    <!-- Angular Card -->
    <a
        href="https://angular.dev"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Angular v22.0 documentation (opens in a new tab)"
        class="group flex flex-col justify-between p-5 rounded-xl border border-border hover:border-border-control hover:shadow-sm bg-card transition-all duration-200 cursor-pointer">
        <div class="flex justify-between items-start w-full">
            <div class="w-10 h-10 rounded-lg bg-red-500/10 flex items-center justify-center text-red-600">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2L2 5.5v10L12 22l10-6.5v-10L12 2zm8 12.8L12 19.3 4 14.8V7.2l8-2.8 8 2.8v7.6z" />
                </svg>
            </div>
            <ng-container *ngTemplateOutlet="arrowIconTemplate"></ng-container>
        </div>
        <div class="mt-6">
            <div class="font-bold text-foreground text-base">Angular</div>
            <div class="text-sm text-muted-foreground mt-1">v22.0</div>
        </div>
    </a>

    <!-- Tailwind Card -->
    <a
        href="https://tailwindcss.com"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Tailwind CSS v4.3 documentation (opens in a new tab)"
        class="group flex flex-col justify-between p-5 rounded-xl border border-border hover:border-border-control hover:shadow-sm bg-card transition-all duration-200 cursor-pointer">
        <div class="flex justify-between items-start w-full">
            <div class="w-10 h-10 rounded-lg bg-teal-500/10 flex items-center justify-center text-teal-600">
                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 .587l3.668 3.668c1.611 1.611 1.611 4.224 0 5.835l-7.335 7.335c-1.611 1.611-4.224 1.611-5.835 0L.587 15.48c-1.611-1.611-1.611-4.224 0-5.835L12 .587zM18.165 6.752l3.668 3.668c1.611 1.611 1.611 4.224 0 5.835l-7.335 7.335c-1.611 1.611-4.224 1.611-5.835 0l-1.947-1.947 7.335-7.335c2.685-2.685 2.685-7.039 0-9.724l4.114 2.168z" />
                </svg>
            </div>
            <ng-container *ngTemplateOutlet="arrowIconTemplate"></ng-container>
        </div>
        <div class="mt-6">
            <div class="font-bold text-foreground text-base">Tailwind CSS</div>
            <div class="text-sm text-muted-foreground mt-1">v4.3</div>
        </div>
    </a>

    <!-- TypeScript Card -->
    <a
        href="https://www.typescriptlang.org"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="TypeScript v6.0 documentation (opens in a new tab)"
        class="group flex flex-col justify-between p-5 rounded-xl border border-border hover:border-border-control hover:shadow-sm bg-card transition-all duration-200 cursor-pointer">
        <div class="flex justify-between items-start w-full">
            <div
                class="w-10 h-10 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-700 font-bold text-sm">
                TS
            </div>
            <ng-container *ngTemplateOutlet="arrowIconTemplate"></ng-container>
        </div>
        <div class="mt-6">
            <div class="font-bold text-foreground text-base">TypeScript</div>
            <div class="text-sm text-muted-foreground mt-1">v6.0</div>
        </div>
    </a>
</div>

<ng-template #arrowIconTemplate>
    <svg lucideArrowUp [size]="16" class="text-muted-foreground group-hover:text-foreground transition-colors"></svg>
</ng-template>
