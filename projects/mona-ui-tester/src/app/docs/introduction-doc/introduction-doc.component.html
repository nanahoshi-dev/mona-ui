<app-markdown-doc src="docs/introduction/intro.md"></app-markdown-doc>

<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-6">
    @for (tech of techStack; track tech.name) {
        <a
            [href]="tech.href"
            target="_blank"
            rel="noopener noreferrer"
            attr.aria-label="{{ tech.name }} v{{ tech.version }} documentation (opens in a new tab)"
            class="group flex flex-col justify-between p-5 rounded-xl border border-border hover:border-border-control hover:shadow-sm bg-card transition-all duration-200 cursor-pointer">
            <div class="flex justify-between items-start w-full">
                <div class="w-10 h-10 rounded-lg bg-surface-muted flex items-center justify-center">
                    <img [ngSrc]="tech.logo" width="24" height="24" alt="" />
                </div>
                <svg
                    lucideArrowUpRight
                    [size]="16"
                    class="text-muted-foreground group-hover:text-foreground transition-colors"></svg>
            </div>
            <div class="mt-6">
                <div class="font-bold text-foreground text-base">{{ tech.name }}</div>
                <div class="text-sm text-muted-foreground mt-1">v{{ tech.version }}</div>
            </div>
        </a>
    }
</div>

<app-markdown-doc src="docs/introduction/next-steps.md" parentSectionId="introduction"></app-markdown-doc>
