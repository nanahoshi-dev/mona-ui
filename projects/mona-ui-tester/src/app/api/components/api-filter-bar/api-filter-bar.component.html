@if (groups().length > 1) {
    <div class="flex flex-wrap gap-1.5" role="group" [attr.aria-label]="'Filter by ' + groupLabel()">
        <button
            type="button"
            class="inline-flex cursor-pointer items-center gap-1.5 rounded-lg border border-border bg-background px-2.5 py-1 text-xs font-medium text-muted-foreground transition-colors hover:not-aria-pressed:bg-hover hover:not-aria-pressed:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus-indicator aria-pressed:border-foreground aria-pressed:bg-foreground aria-pressed:text-background aria-pressed:forced-color-adjust-none forced-colors:aria-pressed:border-[Highlight] forced-colors:aria-pressed:bg-[Highlight] forced-colors:aria-pressed:text-[HighlightText]"
            [attr.aria-pressed]="selected() === null"
            (click)="selected.set(null)">
            All <span class="font-normal">{{ total() }}</span>
        </button>
        @for (group of groups(); track group.key) {
            <button
                type="button"
                class="api-kind-filter inline-flex cursor-pointer items-center gap-1.5 rounded-lg border border-border bg-background px-2.5 py-1 text-xs font-medium text-muted-foreground transition-colors hover:not-aria-pressed:bg-hover hover:not-aria-pressed:text-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus-indicator"
                [style.--api-kind]="group.hue"
                [attr.aria-pressed]="selected() === group.key"
                (click)="selected.set(group.key)">
                <span class="api-kind-dot size-1.5 shrink-0 rounded-full" aria-hidden="true"></span>
                {{ group.title }} <span class="font-normal">{{ group.count }}</span>
            </button>
        }
    </div>
}
<mona-text-box
    class="w-full @2xl:ms-auto @2xl:w-64 @2xl:shrink-0"
    clearButton
    size="small"
    [aria-label]="queryLabel()"
    [inputId]="inputId()"
    [placeholder]="placeholder()"
    [(value)]="query">
    <ng-template monaTextBoxPrefixTemplate>
        <svg lucideSearch class="ms-2 shrink-0 text-muted-foreground" aria-hidden="true" [size]="14"></svg>
    </ng-template>
</mona-text-box>
