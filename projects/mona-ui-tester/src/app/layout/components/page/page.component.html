<app-docs-search></app-docs-search>

<div class="flex h-screen w-full overflow-hidden font-sans">
    <!-- Mobile Drawer Sidebar Backdrop -->
    @if (sidebarService.isOpen()) {
        <div
            (click)="sidebarService.close()"
            class="fixed inset-0 bg-foreground/40 backdrop-blur-xs z-40 md:hidden transition-opacity duration-300"></div>
    }

    <!-- Mobile Drawer Sidebar Container -->
    <div
        class="fixed top-0 bottom-0 left-0 w-64 bg-background border-r border-border z-50 md:hidden flex flex-col h-full transform transition-transform duration-300 shadow-xl overflow-hidden"
        [attr.inert]="sidebarService.isOpen() ? null : ''"
        [class.translate-x-0]="sidebarService.isOpen()"
        [class.-translate-x-full]="!sidebarService.isOpen()">
        <div class="flex items-center justify-between px-4 py-4 border-b border-border">
            <span class="font-bold text-foreground text-lg">Mona UI</span>
            <button
                (click)="sidebarService.close()"
                class="p-1 rounded-lg hover:bg-hover text-muted-foreground cursor-pointer"
                aria-label="Close menu"
                type="button">
                <svg lucideX [size]="18"></svg>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto" (click)="onDrawerClick($event)">
            <app-sidebar></app-sidebar>
        </div>
    </div>

    <!-- Persistent Left Sidebar (Desktop/Tablet) -->
    <app-sidebar class="hidden md:flex w-64 h-full border-r border-border flex-shrink-0 overflow-hidden"></app-sidebar>

    <!-- Main Content Area Wrapper -->
    <div class="flex flex-col flex-1 h-full min-w-0">
        <!-- Breadcrumbs & Actions Header Bar (Desktop/Tablet) -->
        <div
            class="hidden md:flex items-center justify-between px-8 py-4 border-b border-border sticky top-0 bg-header-background/90 backdrop-blur-md z-20 h-16 flex-shrink-0 select-none">
            <!-- Breadcrumbs -->
            <div class="flex items-center gap-2 text-sm text-muted-foreground font-medium">
                <mona-breadcrumb>
                    @for (crumb of activeBreadcrumbs(); track $index) {
                        <mona-breadcrumb-item>{{ crumb }}</mona-breadcrumb-item>
                    }
                </mona-breadcrumb>
            </div>

            <!-- Header Action Items -->
            <div class="flex items-center gap-2 text-muted-foreground">
                <mona-dropdown-list
                    aria-label="Theme"
                    class="w-28"
                    [data]="themeOptions"
                    textField="text"
                    [ngModel]="selectedTheme()"
                    size="small"
                    (ngModelChange)="onThemeChange($event)"></mona-dropdown-list>
                <a
                    [href]="repositoryUrl"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-border text-sm font-semibold text-foreground hover:bg-hover transition-colors cursor-pointer">
                    <!-- The GitHub mark, from Primer Octicons (mark-github-16). -->
                    <svg aria-hidden="true" class="size-4" viewBox="0 0 16 16">
                        <path
                            fill="currentColor"
                            d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"></path>
                    </svg>
                    <!-- The name comes from the content, so it contains the count the link shows (WCAG 2.5.3). Until
                         GitHub gives a count, or if it can't be reached, the link shows the mark alone. -->
                    @if (stars(); as count) {
                        <span class="sr-only">GitHub repository,&#32;</span>
                        <span class="tabular-nums">{{ count.short }}</span>
                        <span class="sr-only">&#32;{{ count.unit }} (opens in a new tab)</span>
                    } @else {
                        <span class="sr-only">GitHub repository (opens in a new tab)</span>
                    }
                </a>
            </div>
        </div>

        <!-- Scrollable Page Content Grid -->
        <div
            #scrollContainer
            class="flex-1 min-h-0 overflow-y-auto px-6 py-6 md:px-8 md:py-8"
            data-page-scroll-container>
            <div class="max-w-6xl w-full mx-auto xl:grid xl:grid-cols-[minmax(0,1fr)_16rem] xl:gap-10">
                <!-- Left/Center Document Content Column -->
                <main class="min-w-0 pb-16">
                    <!-- Page Metadata Actions Bar -->
                    <div class="flex items-center justify-between border-b border-border pb-5 mb-8">
                        <div
                            class="w-12 h-12 rounded-xl border border-border flex items-center justify-center text-primary bg-background shadow-xs">
                            <svg [lucideIcon]="pageIcon()" [size]="22"></svg>
                        </div>
                        <div class="flex items-center gap-2 select-none"></div>
                    </div>

                    <!-- Rendered Document View -->
                    <div>
                        <router-outlet></router-outlet>
                    </div>

                    <app-docs-pager></app-docs-pager>
                </main>

                <!-- Right Sidebar TOC Column -->
                <aside class="hidden xl:block w-60 flex-shrink-0 h-fit sticky top-8">
                    <app-page-navigation></app-page-navigation>
                </aside>
            </div>
        </div>
    </div>
</div>
