<div class="flex flex-col items-start gap-2">
    <mona-calendar selection="range" [months]="3" [(value)]="quarter" />
    <span aria-live="polite" class="text-sm">
        @if (ends(); as ends) {
            {{ ends[0] | date }} to {{ ends[1] | date }}
        } @else {
            Choose the first day, then the last.
        }
    </span>
</div>
