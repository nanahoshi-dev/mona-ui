<form class="flex flex-col gap-4" novalidate (submit)="onSubmit($event)">
    <mona-form-field label="Status update">
        <mona-editor
            class="h-56 w-full"
            showWordCount
            [characterLimit]="limit"
            [formField]="update.post"
            [settings]="{ headings: false, image: false, table: false }" />
    </mona-form-field>
    <div class="flex items-center gap-3">
        <button monaButton look="primary" type="submit">Post</button>
        @if (posted()) {
            <span class="text-sm" role="status">Posted.</span>
        }
    </div>
</form>
