<fieldset class="flex flex-col gap-2">
    <legend class="mb-1 text-sm font-medium">Notify me about</legend>
    @for (topic of topics; track topic) {
        <label class="flex items-center gap-2 text-sm">
            <input monaCheckbox type="checkbox" [checked]="chosen().includes(topic)" (change)="toggle(topic, $event)" />
            {{ topic }}
        </label>
    }
</fieldset>
<p class="mt-3 text-sm">Notifying about: {{ chosen().join(", ") || "nothing" }}</p>
