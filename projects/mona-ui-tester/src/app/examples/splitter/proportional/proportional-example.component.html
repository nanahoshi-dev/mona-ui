<mona-splitter class="h-48 w-full border border-border">
    <mona-splitter-pane label="Fixed" [size]="160">
        <p class="p-4 text-sm">Fixed, 160 px</p>
    </mona-splitter-pane>
    <mona-splitter-pane label="One share" size="1fr">
        <p class="p-4 text-sm">1fr</p>
    </mona-splitter-pane>
    <mona-splitter-pane label="Two shares" size="2fr">
        <p class="p-4 text-sm">2fr</p>
    </mona-splitter-pane>
</mona-splitter>
