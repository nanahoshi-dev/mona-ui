<div class="flex max-w-sm flex-col items-start gap-3">
    <section aria-label="Profile" class="flex w-full items-center gap-4 rounded-md border border-border p-4" [attr.aria-busy]="loading()">
        @if (loading()) {
            <mona-skeleton rounded="full" [height]="56" [width]="56"></mona-skeleton>
            <div class="flex flex-1 flex-col gap-2">
                <mona-skeleton height="1.25rem" width="8rem"></mona-skeleton>
                <mona-skeleton height="1rem"></mona-skeleton>
            </div>
        } @else {
            <div class="flex size-14 shrink-0 items-center justify-center rounded-full bg-primary font-bold text-primary-foreground" aria-hidden="true">JS</div>
            <div class="flex flex-col">
                <span class="font-semibold">Jane Smith</span>
                <span class="text-sm">Product designer, Lisbon</span>
            </div>
        }
    </section>
    <button monaButton type="button" [disabled]="loading()" (click)="reload()">Reload</button>
</div>
