<div class="flex max-w-md flex-col gap-3">
    <mona-progress-bar aria-label="Disk usage" labelPosition="start" [value]="35"></mona-progress-bar>
    <mona-progress-bar aria-label="Memory usage" [value]="60"></mona-progress-bar>
    <mona-progress-bar aria-label="Network usage" labelPosition="end" [value]="85"></mona-progress-bar>
    <mona-progress-bar aria-label="Battery charge" [labelVisible]="false" [value]="50"></mona-progress-bar>
</div>
