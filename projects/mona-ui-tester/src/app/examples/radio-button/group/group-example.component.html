<div class="flex flex-col items-start gap-2">
    <mona-label text="Shipping" [for]="shippingGroup" />
    <mona-radio-group #shippingGroup [(value)]="shipping">
        <mona-radio-button label="Standard, 5 to 7 days" radioValue="standard" />
        <mona-radio-button label="Express, 2 days" radioValue="express" />
        <mona-radio-button label="Same day" radioValue="same-day" [disabled]="true" />
    </mona-radio-group>
    <p class="text-sm">Chosen: {{ shipping() }}</p>
</div>
