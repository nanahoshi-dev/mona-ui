<fieldset class="flex flex-col gap-2">
    <legend class="mb-1 text-sm font-medium">Direction</legend>
    @for (direction of directions; track direction) {
        <label class="flex items-center gap-2 text-sm">
            <input
                monaRadioButton
                name="radio-direction"
                type="radio"
                [checked]="direction === selected()"
                [value]="direction"
                (change)="selected.set(direction)" />
            {{ direction }}
        </label>
    }
</fieldset>
<p class="mt-3 text-sm">Heading: {{ selected() }}</p>
