<div class="flex flex-col gap-3">
    <mona-breadcrumb aria-label="Folder path">
        @for (folder of path(); track $index) {
            <mona-breadcrumb-item (itemClick)="openFolder($index)">{{ folder }}</mona-breadcrumb-item>
        }
    </mona-breadcrumb>
    <button monaButton class="self-start" type="button" [disabled]="path().length === fullPath.length" (click)="path.set(fullPath)">
        Back to the full path
    </button>
</div>
