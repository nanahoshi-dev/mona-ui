<section aria-labelledby="sign-in-heading" class="flex max-w-xs flex-col gap-4 rounded-lg border border-border p-6">
    <h3 id="sign-in-heading" class="text-base font-semibold">Sign in</h3>
    <button monaButton type="button" class="w-full">Continue with a passkey</button>
    <mona-separator label="or" />
    <label class="flex flex-col gap-1 text-sm font-medium">
        Email
        <input monaTextBox type="email" autocomplete="email" />
    </label>
    <button monaButton type="button" look="primary" class="w-full">Email me a link</button>
</section>
