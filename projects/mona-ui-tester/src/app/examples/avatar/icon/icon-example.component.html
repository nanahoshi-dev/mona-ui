<div class="flex flex-wrap items-center gap-3">
    <mona-avatar aria-label="Guest user" borderRadius="50%" [height]="48" [width]="48">
        <span class="flex size-full items-center justify-center text-primary-foreground">
            <svg lucideUser aria-hidden="true" [size]="24"></svg>
        </span>
    </mona-avatar>
    <mona-avatar aria-label="Shared workspace" borderRadius="8px" [height]="48" [width]="48">
        <span class="flex size-full items-center justify-center text-primary-foreground">
            <svg lucideUsers aria-hidden="true" [size]="24"></svg>
        </span>
    </mona-avatar>
</div>
