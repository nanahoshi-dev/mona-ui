<div class="flex max-w-xs flex-col gap-1">
    <label monaLabel for="combo-box-custom-values-tag">Tag</label>
    <mona-combo-box
        inputId="combo-box-custom-values-tag"
        placeholder="Pick or type a tag"
        textField="name"
        valueField="id"
        [allowCustomValue]="true"
        [data]="tags()"
        [(value)]="tag"
        (valueAdd)="addTag($event)" />
    <span aria-live="polite" class="text-sm">Selected: {{ tag()?.name ?? "none" }} ({{ tags().length }} tags)</span>
</div>
