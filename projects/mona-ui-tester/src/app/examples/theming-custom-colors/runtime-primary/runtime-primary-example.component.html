<div class="flex flex-wrap items-center gap-3">
    <mona-color-picker
        aria-label="Primary color"
        view="gradient"
        [opacity]="false"
        [value]="color()"
        (valueChange)="apply($event)" />
    <button monaButton look="primary" type="button">Primary action</button>
    <button monaButton type="button" [disabled]="!color()" (click)="apply(null)">Reset</button>
</div>
