<div class="flex max-w-xs flex-col gap-2">
    <mona-tree-view
        aria-label="Product categories"
        checkBy="id"
        expandBy="id"
        idField="id"
        mode="flat"
        monaTreeViewCheckable
        monaTreeViewExpandable
        parentIdField="parentId"
        textField="text"
        [data]="categories"
        [expandedKeys]="[1, 4]"
        [(checkedKeys)]="checkedKeys" />
    <span aria-live="polite" class="text-sm">Checked: {{ checkedNames().join(", ") || "nothing" }}</span>
</div>
