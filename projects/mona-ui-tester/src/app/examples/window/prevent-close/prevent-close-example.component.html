<button monaButton type="button" (click)="open.set(true)">Edit profile</button>

@if (open()) {
    <mona-window title="Edit profile" [width]="340" (close)="confirmClose($event)" (closed)="open.set(false)">
        <div class="flex flex-col gap-2 p-3">
            <mona-label for="window-profile-name">Display name</mona-label>
            <mona-text-box inputId="window-profile-name" [(value)]="name" />
            <p aria-live="polite" class="text-sm">{{ message() }}</p>
        </div>
        <ng-template monaWindowFooterTemplate>
            <div class="flex justify-end gap-2 border-t border-border p-2">
                <button monaButton size="small" type="button" (click)="name.set(saved())">Undo</button>
                <button monaButton look="primary" size="small" type="button" (click)="save()">Save</button>
            </div>
        </ng-template>
    </mona-window>
}
