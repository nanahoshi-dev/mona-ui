<div class="flex flex-col gap-3">
    <mona-scroll-view
        aria-label="Getting started"
        height="160px"
        width="100%"
        [data]="steps"
        [pageable]="true"
        [(index)]="page">
        <ng-template let-step [monaScrollViewSlide]="steps">
            <div class="flex h-full items-center justify-center bg-secondary px-12 text-center text-secondary-foreground">
                <p class="text-sm">{{ step }}</p>
            </div>
        </ng-template>
    </mona-scroll-view>
    <div class="flex items-center gap-3">
        <button monaButton type="button" [disabled]="page() === 0" (click)="page.set(0)">Start over</button>
        <span class="text-sm">Step {{ page() + 1 }} of {{ steps.length }}</span>
    </div>
</div>
