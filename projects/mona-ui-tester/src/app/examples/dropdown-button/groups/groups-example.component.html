<div class="flex flex-wrap items-center gap-3">
    <mona-dropdown-button text="File" (menuItemClick)="lastAction.set($event.label)">
        <mona-dropdown-button-group title="Document">
            <mona-dropdown-button-item label="New" />
            <mona-dropdown-button-item label="Open" />
            <mona-dropdown-button-item label="Save" [disabled]="true" />
        </mona-dropdown-button-group>
        <mona-dropdown-button-separator />
        <mona-dropdown-button-item label="Print" />
    </mona-dropdown-button>
    <span aria-live="polite" class="text-sm">Last action: {{ lastAction() }}</span>
</div>
