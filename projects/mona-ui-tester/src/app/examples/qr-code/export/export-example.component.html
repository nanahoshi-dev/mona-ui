<div class="flex flex-col items-start gap-3">
    <mona-qr-code
        #qrCode="monaQrCode"
        aria-label="QR code that joins the guest Wi-Fi"
        value="WIFI:T:WPA;S:Guest;P:welcome-2026;;" />
    <div class="flex gap-2">
        @for (format of formats; track format) {
            <button monaButton type="button" (click)="download(qrCode, format)">
                Download {{ format.toUpperCase() }}
            </button>
        }
    </div>
    <p aria-live="polite" class="text-sm text-muted-foreground">{{ status() }}</p>
</div>
