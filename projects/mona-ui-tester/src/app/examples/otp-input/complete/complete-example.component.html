<div class="flex flex-col items-start gap-2">
    <mona-label text="Code from your authenticator app">
        <mona-otp-input
            type="number"
            [length]="6"
            [readonly]="status() === 'checking'"
            [(value)]="code"
            (complete)="verify($event)" />
    </mona-label>
    <span aria-live="polite" class="text-sm">
        @switch (status()) {
            @case ("checking") { Checking… }
            @case ("verified") { Verified. }
            @case ("wrong") { That code is wrong. Try 123456. }
            @default { Enter all six digits to verify. }
        }
    </span>
</div>
