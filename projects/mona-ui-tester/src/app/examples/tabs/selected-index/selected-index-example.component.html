<div class="flex flex-col gap-3">
    <mona-tabs aria-label="Account" [(selectedIndex)]="activeTab">
        <mona-tab title="Account">
            <ng-template monaTabContentTemplate>
                <p class="p-4 text-sm">Name, email and language.</p>
            </ng-template>
        </mona-tab>
        <mona-tab title="Security">
            <ng-template monaTabContentTemplate>
                <p class="p-4 text-sm">Password and two-factor sign-in.</p>
            </ng-template>
        </mona-tab>
    </mona-tabs>
    <div class="flex items-center gap-3">
        <button monaButton type="button" (click)="activeTab.set(1)">Review security</button>
        <span class="text-sm">Selected index: {{ activeTab() }}</span>
    </div>
</div>
