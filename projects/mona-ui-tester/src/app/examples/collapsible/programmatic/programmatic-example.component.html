<div class="flex flex-col gap-3">
    <div class="flex flex-wrap gap-2">
        <button monaButton type="button" (click)="log.expand()">Expand</button>
        <button monaButton type="button" (click)="log.collapse()">Collapse</button>
        <button monaButton type="button" [toggleable]="true" [(selected)]="locked">Lock the trigger</button>
    </div>
    <section #log="monaCollapsible" class="max-w-md rounded-md border border-border" monaCollapsible [disabled]="locked()">
        <button class="w-full px-4 py-3 text-left font-medium" monaCollapsibleTrigger type="button">Build log</button>
        <div monaCollapsibleContent>
            <p class="border-t border-border px-4 py-3 text-sm">Compiled 42 files in 3.1 seconds. No warnings.</p>
        </div>
    </section>
</div>
