<div class="grid max-w-sm gap-3">
    <div class="flex flex-col gap-1">
        <label class="text-sm font-medium" for="input-email">Email</label>
        <input monaTextBox autocomplete="email" id="input-email" type="email" />
    </div>
    <div class="flex flex-col gap-1">
        <label class="text-sm font-medium" for="input-guests">Guests</label>
        <input monaTextBox id="input-guests" max="8" min="1" type="number" value="2" />
    </div>
    <div class="flex flex-col gap-1">
        <label class="text-sm font-medium" for="input-arrival">Arrival</label>
        <input monaTextBox id="input-arrival" type="date" />
    </div>
    <div class="flex flex-col gap-1">
        <label class="text-sm font-medium" for="input-code">Discount code</label>
        <input monaTextBox disabled id="input-code" type="text" value="SPRING25" />
    </div>
</div>
