<mona-card class="max-w-sm">
    <mona-card-header>
        <h3 *monaCardTitle class="font-semibold">Invite a teammate</h3>
        <p *monaCardDescription class="text-sm">They'll get an email with a link to join.</p>
    </mona-card-header>

    <div *monaCardContent class="flex flex-col gap-2 px-4">
        <mona-label for="card-invite-email">Email</mona-label>
        <mona-text-box inputId="card-invite-email" placeholder="name@example.com" type="email" [(value)]="email" />
    </div>

    <mona-card-footer class="flex justify-end gap-2">
        <button monaButton size="small" type="button" (click)="email.set('')">Cancel</button>
        <button monaButton look="primary" size="small" type="button" [disabled]="!email()">Send invite</button>
    </mona-card-footer>
</mona-card>
