<mona-card class="max-w-sm" role="article">
    <mona-card-header>
        <h3 *monaCardTitle class="font-semibold">Release 4.2</h3>
        <p *monaCardDescription class="text-sm">Published on 3 November</p>
        <button *monaCardAction monaButton look="link" size="small" type="button">Share</button>
    </mona-card-header>

    <p *monaCardContent class="px-4 text-sm">
        This release adds a dark theme, faster search and keyboard shortcuts for the editor.
    </p>

    <mona-card-footer class="flex justify-end gap-2">
        <button monaButton size="small" type="button">Dismiss</button>
        <button monaButton look="primary" size="small" type="button">Read the notes</button>
    </mona-card-footer>
</mona-card>
