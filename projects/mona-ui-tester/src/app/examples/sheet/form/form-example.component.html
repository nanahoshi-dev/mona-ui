<div class="flex items-center gap-3">
    <button monaButton type="button" (click)="edit()">Edit profile</button>
    <span class="text-sm">Name: {{ name() }}</span>
</div>

@if (open()) {
    <mona-sheet description="Changes show once you save them." title="Edit profile" (closed)="open.set(false)">
        <div class="flex flex-col gap-2 px-4">
            <mona-label for="sheet-profile-name">Display name</mona-label>
            <mona-text-box inputId="sheet-profile-name" [(value)]="draft" />
            <div class="flex justify-end gap-2 pt-2">
                <button monaButton type="button" (click)="open.set(false)">Cancel</button>
                <button monaButton look="primary" type="button" (click)="save()">Save changes</button>
            </div>
        </div>
    </mona-sheet>
}
