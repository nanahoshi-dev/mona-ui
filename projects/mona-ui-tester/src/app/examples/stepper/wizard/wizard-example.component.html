<div class="flex flex-col gap-4">
    <mona-stepper aria-label="Checkout" [steps]="steps" [(step)]="currentStep" />

    <p class="text-sm">{{ descriptions[currentStep()] }}</p>

    <div class="flex gap-2">
        <button monaButton type="button" [disabled]="currentStep() === 0" (click)="currentStep.set(currentStep() - 1)">
            Back
        </button>
        <button
            monaButton
            look="primary"
            type="button"
            [disabled]="currentStep() === steps.length - 1"
            (click)="currentStep.set(currentStep() + 1)">
            Next
        </button>
    </div>
</div>
