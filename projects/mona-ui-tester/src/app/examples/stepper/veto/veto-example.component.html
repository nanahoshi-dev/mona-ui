<div class="flex flex-col gap-3">
    <!-- The step list sits outside the stepper's box, so leave room for it above and below. -->
    <mona-stepper class="mt-4 mb-12" aria-label="Sign-up" [steps]="steps" [(step)]="currentStep" (stepSelect)="select($event)" />
    <div class="flex items-center gap-3">
        <button monaButton type="button" [toggleable]="true" [(selected)]="accountDone">Account details filled in</button>
        <span aria-live="polite" class="text-sm">{{ message() }}</span>
    </div>
</div>
