<div class="flex flex-col gap-3">
    <!-- The step list sits outside the stepper's box, so leave room for it above and below. -->
    <mona-stepper class="mt-4 mb-12" aria-label="Project setup" [linear]="false" [steps]="steps" [(step)]="currentStep" />
    <p class="text-sm">Current step: {{ steps[currentStep()].label }}</p>
</div>
