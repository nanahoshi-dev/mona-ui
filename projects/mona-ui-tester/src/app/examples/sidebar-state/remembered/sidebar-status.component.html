<div class="flex flex-wrap items-center gap-2">
    <button monaButton size="small" type="button" (click)="sidebar.expand()">Expand</button>
    <button monaButton size="small" type="button" (click)="sidebar.collapse()">Collapse</button>
    <button monaButton size="small" type="button" (click)="sidebar.toggle()">Toggle</button>
</div>
<dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1 text-sm">
    <dt class="font-medium">state</dt>
    <dd>{{ sidebar.state() }}</dd>
    <dt class="font-medium">iconOnly</dt>
    <dd>{{ sidebar.iconOnly() }}</dd>
    <dt class="font-medium">compact</dt>
    <dd>{{ sidebar.compact() }}</dd>
</dl>
