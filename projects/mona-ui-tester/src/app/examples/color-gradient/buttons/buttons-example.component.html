<div class="flex flex-col items-start gap-2">
    <mona-color-gradient
        aria-label="Theme color"
        [(value)]="color"
        (apply)="lastAction.set('applied')"
        (cancel)="lastAction.set('canceled')" />
    <span aria-live="polite" class="text-sm">Saved: {{ color() }}, last action: {{ lastAction() }}</span>
</div>
