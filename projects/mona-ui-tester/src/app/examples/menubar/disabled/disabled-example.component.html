<div class="flex flex-col items-start gap-3">
    <mona-check-box label="Text is selected" [(checked)]="hasSelection" />
    <mona-menubar aria-label="Editor">
        <mona-menu text="File">
            <mona-menu-item label="New" />
            <mona-menu-item label="Open" />
        </mona-menu>
        <mona-menu text="Edit" [disabled]="!hasSelection()">
            <mona-menu-item label="Cut" />
            <mona-menu-item label="Copy" />
        </mona-menu>
    </mona-menubar>
</div>
