<div class="flex flex-col gap-5">
    <div class="flex flex-wrap gap-2" role="group" aria-label="Filter issues">
        <mona-chip label="Open" [toggleable]="true" [(selected)]="open"></mona-chip>
        <mona-chip label="Urgent" look="error" [toggleable]="true" [(selected)]="urgent"></mona-chip>
        <mona-chip label="Removable" [toggleable]="true" [removable]="true"></mona-chip>
    </div>
    <mona-tabs aria-label="Account">
        <mona-tab title="Account">
            <ng-template monaTabContentTemplate>
                <p class="p-4 text-sm">Name, email and language.</p>
            </ng-template>
        </mona-tab>
        <mona-tab title="Security">
            <ng-template monaTabContentTemplate>
                <p class="p-4 text-sm">Password and two-factor sign-in.</p>
            </ng-template>
        </mona-tab>
        <mona-tab title="Billing">
            <ng-template monaTabContentTemplate>
                <p class="p-4 text-sm">Plan and invoices.</p>
            </ng-template>
        </mona-tab>
    </mona-tabs>
    <mona-list-box
        class="max-w-xs"
        aria-label="Fruits"
        height="160px"
        selectBy="id"
        selectionMode="multiple"
        textField="name"
        [items]="fruits"
        [toolbar]="false"
        [(selectedKeys)]="selectedIds" />
</div>
