<div class="flex flex-col gap-3">
    <div class="grid gap-3 sm:grid-cols-3">
        @for (destination of destinations; track destination.name) {
            <button
                monaRipple
                type="button"
                class="relative flex cursor-pointer flex-col items-start gap-1 rounded-lg border border-border bg-surface p-4 text-start text-foreground transition-colors hover:bg-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-focus-indicator forced-colors:border-[ButtonBorder]"
                (click)="opened.set(destination.name)">
                <span class="text-sm font-medium">{{ destination.name }}</span>
                <span class="text-sm text-muted-foreground">{{ destination.description }}</span>
            </button>
        }
    </div>
    <span aria-live="polite" class="text-sm">Opened: {{ opened() }}</span>
</div>
