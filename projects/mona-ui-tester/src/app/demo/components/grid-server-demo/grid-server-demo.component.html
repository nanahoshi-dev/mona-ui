@let g = grid();
@let c = columns();

<app-parts-demo-container
    eventsHint="Page, sort or filter the server grid, or scroll the virtual one to its end, to see the events."
    [eventLog]="eventLog"
    [parts]="parts()"
    [(values)]="values">
    <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
        <div class="flex items-center gap-2">
            <span class="text-sm font-medium" id="grid-server-mode">Mode</span>
            <mona-segmented
                aria-labelledby="grid-server-mode"
                size="small"
                [options]="modeOptions"
                [value]="mode()"
                (valueChange)="onModeChange($event)"></mona-segmented>
        </div>
        @if (mode() === "virtual") {
            <div class="flex items-center gap-2">
                <span class="text-sm font-medium" id="grid-server-rows">Rows</span>
                <mona-segmented
                    aria-labelledby="grid-server-rows"
                    size="small"
                    [options]="rowCountOptions"
                    [value]="rowCount()"
                    (valueChange)="onRowCountChange($event)"></mona-segmented>
            </div>
        }
    </div>

    @if (ready()) {
        @if (mode() === "server") {
            <mona-grid
                class="h-112 w-full"
                monaGridServerBinding
                monaGridSortable
                rowKey="orderId"
                [aria-label]="g.ariaLabel"
                [data]="page().data"
                [loading]="loading()"
                [monaGridFilterable]="{ enabled: true, type: 'row' }"
                [pageSize]="g.pageSize"
                [skip]="state().skip"
                [total]="page().total"
                [(filter)]="filter"
                [(sort)]="sort"
                (dataStateChange)="onDataStateChange($event)"
                (pageSizeChange)="onPageSizeChange($event)">
                <mona-grid-column field="orderId" type="number" [title]="c.orderId.title"></mona-grid-column>
                <mona-grid-column field="customer" [title]="c.customer.title"></mona-grid-column>
                <mona-grid-column field="shipCountry" [title]="c.shipCountry.title"></mona-grid-column>
                <mona-grid-column field="freight" type="number" [title]="c.freight.title"></mona-grid-column>
            </mona-grid>
            <p aria-live="polite" class="min-h-5 text-sm text-error">{{ error() ?? "" }}</p>
            <div class="flex flex-col gap-1 text-sm">
                <span data-request-count>Requests: {{ requests() }}</span>
                <span class="font-medium">Last requested data state</span>
                <pre class="max-h-48 overflow-auto text-xs" tabindex="0">{{ state() | json }}</pre>
            </div>
        } @else {
            <mona-grid
                class="h-112 w-full"
                rowKey="orderId"
                [aria-label]="g.ariaLabel"
                [data]="rows()"
                [monaGridVirtualScroll]="virtualOptions()"
                [pageSize]="g.pageSize"
                [scrollEndThreshold]="virtualScroll().scrollEndThreshold"
                (pageSizeChange)="onPageSizeChange($event)"
                (scrollEnd)="onScrollEnd()">
                <mona-grid-column field="orderId" type="number" [title]="c.orderId.title"></mona-grid-column>
                <mona-grid-column field="customer" [title]="c.customer.title"></mona-grid-column>
                <mona-grid-column field="shipCountry" [title]="c.shipCountry.title"></mona-grid-column>
                <mona-grid-column field="freight" type="number" [title]="c.freight.title"></mona-grid-column>
            </mona-grid>
            <p aria-live="polite" class="text-sm" data-row-count>Loaded rows: {{ rows().length }}</p>
        }
    }
</app-parts-demo-container>
