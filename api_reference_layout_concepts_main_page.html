<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Reference Layout Concepts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .inline-code {
      font-family: 'JetBrains Mono', 'Fira Code', SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8125rem;
      padding: 0.125rem 0.375rem;
      border-radius: 0.375rem;
    }
    /* Minimal fallback rules in case external Tailwind CDN is blocked by a proxy */
    .hidden { display: none; }
    @media (prefers-reduced-motion: reduce) {
      *, ::before, ::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 min-h-screen pb-20">

  <!-- Top Control Bar -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300 border border-indigo-200/60 dark:border-indigo-800/60">
            Entry Point UX
          </span>
          <h1 class="text-lg font-semibold tracking-tight">Package Entry Point Variations</h1>
        </div>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
          5 functional, low-noise layouts for <code class="font-mono text-[11px]">@nanahoshi/mona-ui/tree-view</code> aligned with your Soft Tinted Wash system
        </p>
      </div>

      <!-- Interactive Preview Controls -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Width Simulator -->
        <div class="inline-flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border border-slate-200/70 dark:border-slate-700/70 text-xs">
          <span class="px-2 text-slate-500 dark:text-slate-400 hidden sm:inline">Container:</span>
          <button onclick="setWidth('max-w-2xl', this)" class="width-btn px-2.5 py-1 rounded-md font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">
            Narrow (672px)
          </button>
          <button onclick="setWidth('max-w-4xl', this)" class="width-btn active px-2.5 py-1 rounded-md font-medium bg-white dark:bg-slate-700 text-slate-900 dark:text-white shadow-sm transition">
            Docs (896px)
          </button>
          <button onclick="setWidth('max-w-5xl', this)" class="width-btn px-2.5 py-1 rounded-md font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition">
            Wide (1024px)
          </button>
        </div>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" aria-label="Toggle Dark Mode" class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition">
          <svg id="sun-icon" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg id="moon-icon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <!-- Concept Tabs -->
    <div class="max-w-6xl mx-auto px-4 sm:px-6 overflow-x-auto">
      <nav class="flex gap-1 border-t border-slate-100 dark:border-slate-800/80 pt-2 pb-0 text-sm" id="tabs-nav">
        <button onclick="selectTab('semantic-grid', this)" class="tab-btn active px-3.5 py-2 font-medium border-b-2 border-indigo-600 text-indigo-600 dark:border-indigo-400 dark:text-indigo-400 whitespace-nowrap transition">
          1. Semantic Grid + Wash
        </button>
        <button onclick="selectTab('tiered-density', this)" class="tab-btn px-3.5 py-2 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap transition">
          2. Tiered Density
        </button>
        <button onclick="selectTab('sticky-rail', this)" class="tab-btn px-3.5 py-2 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap transition">
          3. Sticky Index Rail
        </button>
        <button onclick="selectTab('adaptive-list', this)" class="tab-btn px-3.5 py-2 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap transition">
          4. Adaptive 2-Col List
        </button>
        <button onclick="selectTab('editorial-index', this)" class="tab-btn px-3.5 py-2 font-medium border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 whitespace-nowrap transition">
          5. Clean Editorial Index
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Preview Canvas -->
  <main id="preview-container" class="max-w-4xl mx-auto px-4 sm:px-6 mt-8 transition-all duration-300">
    <!-- Rationale Banner -->
    <div id="rationale-box" class="mb-6 p-4 rounded-xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h2 id="concept-title" class="text-base font-semibold text-slate-900 dark:text-white"></h2>
        <p id="concept-desc" class="text-sm text-slate-600 dark:text-slate-400 mt-1 leading-relaxed"></p>
      </div>
      <div class="shrink-0 flex flex-wrap gap-1.5" id="concept-tags"></div>
    </div>

    <!-- Rendered Design Area -->
    <div id="design-stage" class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 shadow-sm p-6 sm:p-8">
      <!-- Injected dynamically -->
    </div>
  </main>

  <!-- Copy Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-12 opacity-0 transition-all duration-200 pointer-events-none bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 text-xs font-medium px-3.5 py-2.5 rounded-lg shadow-lg flex items-center gap-2">
    <svg class="w-4 h-4 text-emerald-400 dark:text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    <span id="toast-msg">Copied selector</span>
  </div>

  <script>
    // Entry point metadata & exports from @nanahoshi/mona-ui/tree-view
    const entryPoint = {
      path: '@nanahoshi/mona-ui/tree-view',
      totalExports: 37,
      guideTitle: 'Tree View',
      guideHref: '#guide-tree-view',
      sections: [
        {
          id: 'components',
          title: 'Components',
          kind: 'Component',
          items: [
            { name: 'TreeViewComponent', descriptionHtml: '' }
          ]
        },
        {
          id: 'directives',
          title: 'Directives',
          kind: 'Directive',
          items: [
            { name: 'TreeViewCheckableDirective', descriptionHtml: '' },
            { name: 'TreeViewDisableDirective', descriptionHtml: '' },
            { name: 'TreeViewDragAndDropDirective', descriptionHtml: '' },
            { name: 'TreeViewExpandableDirective', descriptionHtml: '' },
            { name: 'TreeViewFilterableDirective', descriptionHtml: '' },
            { name: 'TreeViewNodeTemplateDirective', descriptionHtml: "Template for each node's content." },
            { name: 'TreeViewSelectableDirective', descriptionHtml: '' }
          ]
        },
        {
          id: 'classes',
          title: 'Classes',
          kind: 'Class',
          items: [
            { name: 'NodeCheckEvent', descriptionHtml: '' },
            { name: 'NodeClickEvent', descriptionHtml: '' },
            { name: 'NodeDragEndEvent', descriptionHtml: '' },
            { name: 'NodeDragEvent', descriptionHtml: '' },
            { name: 'NodeDragStartEvent', descriptionHtml: '' },
            {
              name: 'NodeDropEvent',
              descriptionHtml: 'A request to move a node: a drop, or a keyboard move (Ctrl+Shift+Arrow), whose original event is then the <code class="inline-code bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700">KeyboardEvent</code>.'
            },
            { name: 'NodeSelectEvent', descriptionHtml: '' },
            { name: 'TreeNode', descriptionHtml: 'A node of a tree, wrapping its data item.' }
          ]
        }
      ]
    };

    // Interactive filter state for testing live UX
    let activeTabKey = 'semantic-grid';
    let searchQuery = '';
    let kindFilter = 'ALL';

    // Semantic tokens aligned with your chosen "2. Soft Tinted Wash" aesthetic
    function getKindTokens(kind) {
      if (kind === 'Component') {
        return {
          dot: 'bg-sky-500 dark:bg-sky-400',
          badgeText: 'text-sky-700 dark:text-sky-300',
          badgeBg: 'bg-sky-50 dark:bg-sky-950/60 border-sky-200/80 dark:border-sky-800/70',
          cardWash: 'border-sky-200/80 dark:border-sky-900/60 border-l-sky-500 dark:border-l-sky-400 bg-sky-50/35 dark:bg-sky-950/15 hover:border-sky-300 dark:hover:border-sky-700',
          headerTint: 'bg-sky-50/60 dark:bg-sky-950/25 border-sky-200/70 dark:border-sky-900/60',
          leftBorder: 'border-l-sky-500 dark:border-l-sky-400',
          rowHover: 'hover:bg-sky-50/40 dark:hover:bg-sky-950/20'
        };
      }
      if (kind === 'Directive') {
        return {
          dot: 'bg-amber-500 dark:bg-amber-400',
          badgeText: 'text-amber-700 dark:text-amber-300',
          badgeBg: 'bg-amber-50 dark:bg-amber-950/60 border-amber-200/80 dark:border-amber-800/70',
          cardWash: 'border-amber-200/80 dark:border-amber-900/60 border-l-amber-500 dark:border-l-amber-400 bg-amber-50/35 dark:bg-amber-950/15 hover:border-amber-300 dark:hover:border-amber-700',
          headerTint: 'bg-amber-50/60 dark:bg-amber-950/25 border-amber-200/70 dark:border-amber-900/60',
          leftBorder: 'border-l-amber-500 dark:border-l-amber-400',
          rowHover: 'hover:bg-amber-50/40 dark:hover:bg-amber-950/20'
        };
      }
      // Class
      return {
        dot: 'bg-violet-500 dark:bg-violet-400',
        badgeText: 'text-violet-700 dark:text-violet-300',
        badgeBg: 'bg-violet-50 dark:bg-violet-950/60 border-violet-200/80 dark:border-violet-800/70',
        cardWash: 'border-violet-200/80 dark:border-violet-900/60 border-l-violet-500 dark:border-l-violet-400 bg-violet-50/35 dark:bg-violet-950/15 hover:border-violet-300 dark:hover:border-violet-700',
        headerTint: 'bg-violet-50/60 dark:bg-violet-950/25 border-violet-200/70 dark:border-violet-900/60',
        leftBorder: 'border-l-violet-500 dark:border-l-violet-400',
        rowHover: 'hover:bg-violet-50/40 dark:hover:bg-violet-950/20'
      };
    }

    function getFilteredSections() {
      const q = searchQuery.trim().toLowerCase();
      return entryPoint.sections
        .filter(sec => kindFilter === 'ALL' || sec.kind === kindFilter)
        .map(sec => ({
          ...sec,
          items: sec.items.filter(item => {
            if (!q) return true;
            const plainDesc = item.descriptionHtml.replace(/<[^>]*>/g, '').toLowerCase();
            return item.name.toLowerCase().includes(q) || plainDesc.includes(q);
          })
        }))
        .filter(sec => sec.items.length > 0);
    }

    function renderCopyPill(text, labelPrefix = '') {
      return `
        <button
          onclick="copySelector('${text.replace(/'/g, "\\'")}')"
          title="Copy to clipboard"
          class="group/cp inline-flex items-center gap-2 font-mono text-xs px-2.5 py-1.5 rounded-lg bg-slate-100/90 hover:bg-slate-200/80 dark:bg-slate-800 dark:hover:bg-slate-700/90 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700 transition cursor-pointer max-w-full"
        >
          ${labelPrefix ? `<span class="text-slate-400 dark:text-slate-500 select-none">${labelPrefix}</span>` : ''}
          <span class="truncate">${text}</span>
          <svg class="w-3.5 h-3.5 shrink-0 text-slate-400 group-hover/cp:text-slate-700 dark:group-hover/cp:text-white transition" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      `;
    }

    function renderGuideCallout(variant = 'pill') {
      if (variant === 'card') {
        return `
          <a href="${entryPoint.guideHref}" onclick="event.preventDefault()" class="group flex items-center justify-between gap-3 px-3.5 py-2.5 rounded-xl border border-slate-200/90 dark:border-slate-700/80 bg-slate-50/80 dark:bg-slate-800/60 hover:border-indigo-300 dark:hover:border-indigo-700 hover:bg-indigo-50/40 dark:hover:bg-indigo-950/30 transition">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 flex items-center justify-center text-indigo-600 dark:text-indigo-400 shrink-0">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
              </div>
              <div>
                <div class="text-[11px] font-medium uppercase tracking-wider text-slate-400 dark:text-slate-500">Related Guide</div>
                <div class="text-sm font-semibold text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition">${entryPoint.guideTitle}</div>
              </div>
            </div>
            <svg class="w-4 h-4 text-slate-400 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </a>
        `;
      }
      return `
        <a href="${entryPoint.guideHref}" onclick="event.preventDefault()" class="group inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-50/80 hover:bg-indigo-100/80 dark:bg-indigo-950/50 dark:hover:bg-indigo-900/50 text-indigo-700 dark:text-indigo-300 border border-indigo-200/80 dark:border-indigo-800/70 transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>Guide: <strong class="font-semibold">${entryPoint.guideTitle}</strong></span>
          <svg class="w-3.5 h-3.5 group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
      `;
    }

    function renderFilterBar(showKindPills = true) {
      const totalShown = entryPoint.sections.reduce((acc, s) => acc + s.items.length, 0);
      return `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          ${showKindPills ? `
            <div class="flex flex-wrap items-center gap-1.5">
              <button onclick="setKindFilter('ALL')" class="px-2.5 py-1 rounded-lg text-xs font-medium border transition ${kindFilter === 'ALL' ? 'bg-slate-900 text-white border-slate-900 dark:bg-white dark:text-slate-900 dark:border-white' : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-slate-300'}">
                All <span class="opacity-70 ml-0.5">${totalShown}</span>
              </button>
              ${entryPoint.sections.map(sec => {
                const t = getKindTokens(sec.kind);
                const active = kindFilter === sec.kind;
                return `
                  <button onclick="setKindFilter('${sec.kind}')" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-medium border transition ${active ? `${t.badgeBg} ${t.badgeText} ring-1 ring-current/20` : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-slate-300'}">
                    <span class="w-1.5 h-1.5 rounded-full ${t.dot}"></span>
                    ${sec.title}
                    <span class="opacity-70">${sec.items.length}</span>
                  </button>
                `;
              }).join('')}
            </div>
          ` : '<div></div>'}

          <div class="relative w-full sm:w-64">
            <svg class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input
              id="symbol-search-input"
              type="text"
              value="${searchQuery.replace(/"/g, '&quot;')}"
              oninput="handleSearch(this.value)"
              placeholder="Filter exports..."
              class="w-full pl-8 pr-7 py-1.5 text-xs rounded-lg bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 transition"
            />
            ${searchQuery ? `
              <button onclick="handleSearch('')" aria-label="Clear filter" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function renderEmptyFilterState() {
      return `
        <div class="py-10 text-center border border-dashed border-slate-200 dark:border-slate-800 rounded-xl">
          <p class="text-sm text-slate-500 dark:text-slate-400">No exports match "<span class="font-mono text-slate-700 dark:text-slate-200">${searchQuery}</span>"</p>
          <button onclick="resetFilters()" class="mt-2 text-xs font-medium text-indigo-600 dark:text-indigo-400 hover:underline">Reset filters</button>
        </div>
      `;
    }

    const concepts = {
      'semantic-grid': {
        title: '1. Semantic Grid + Soft Tinted Wash (Cohesive System)',
        desc: 'Extends your chosen Soft Tinted Wash language to the entry-point index. Replaces sparse full-width rows with a responsive 2-column grid of semantic cards, a structured entry-point header with copyable import path, and instant kind/text filtering.',
        tags: ['Matches Soft Wash cards', 'Eliminates empty row voids', 'Interactive filter'],
        render: () => {
          const sections = getFilteredSections();
          return `
            <div class="space-y-7">
              <!-- Structured Entry Point Header -->
              <div class="pb-6 border-b border-slate-200/80 dark:border-slate-800">
                <div class="flex flex-col lg:flex-row lg:items-start lg:justify-between gap-4">
                  <div>
                    <div class="flex flex-wrap items-center gap-2">
                      <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold uppercase tracking-wider bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700">
                        Entry point
                      </span>
                      <span class="text-xs text-slate-500 dark:text-slate-400">
                        ${entryPoint.totalExports} exports
                      </span>
                    </div>
                    <h2 class="mt-2 font-mono text-xl sm:text-2xl font-bold tracking-tight text-slate-900 dark:text-white break-all">
                      ${entryPoint.path}
                    </h2>
                    <div class="mt-3 flex flex-wrap items-center gap-2.5">
                      ${renderCopyPill(entryPoint.path, 'from')}
                      ${renderGuideCallout('pill')}
                    </div>
                  </div>
                </div>

                <div class="mt-5 pt-4 border-t border-slate-100 dark:border-slate-800/70">
                  ${renderFilterBar(true)}
                </div>
              </div>

              <!-- Grouped Semantic Grids -->
              ${sections.length === 0 ? renderEmptyFilterState() : sections.map(sec => {
                const t = getKindTokens(sec.kind);
                return `
                  <section>
                    <div class="flex items-center gap-2.5 mb-3">
                      <span class="w-2 h-2 rounded-full ${t.dot}"></span>
                      <h3 class="text-sm font-semibold text-slate-900 dark:text-white">${sec.title}</h3>
                      <span class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                        ${sec.items.length}
                      </span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                      ${sec.items.map(item => `
                        <a href="#${item.name}" onclick="event.preventDefault()" class="group block rounded-xl border border-l-4 ${t.cardWash} px-4 py-3 transition">
                          <div class="flex items-center justify-between gap-2">
                            <span class="font-mono text-[13px] font-semibold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition truncate">
                              ${item.name}
                            </span>
                            <svg class="w-3.5 h-3.5 shrink-0 text-slate-400 opacity-60 group-hover:opacity-100 group-hover:translate-x-0.5 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-all" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                          </div>
                          ${item.descriptionHtml ? `
                            <p class="mt-1.5 text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                              ${item.descriptionHtml}
                            </p>
                          ` : ''}
                        </a>
                      `).join('')}
                    </div>
                  </section>
                `;
              }).join('')}
            </div>
          `;
        }
      },
      'tiered-density': {
        title: '2. Tiered Density (Documented Highlights + Compact Matrix)',
        desc: 'Separates symbols with descriptions from self-explanatory ones. Documented exports appear first as prominent Soft Tinted Wash cards, while undocumented exports pack cleanly into a multi-column chip grid—cutting vertical scroll nearly in half.',
        tags: ['~45% less vertical scroll', 'Highlights documented APIs', 'Zero blank columns'],
        render: () => {
          const sections = getFilteredSections();

            <div class="space-y-7">

                  </span>
                  <div class="mt-1 flex flex-wrap items-center gap-2.5">
                    <h2 class="font-mono text-xl sm:text-2xl font-bold text-slate-900 dark:text-white break-all">
                      ${entryPoint.path}
                    </h2>
                    ${renderCopyPill(entryPoint.path)}
                  </div>
                </div>
                <div class="shrink-0">
                  ${renderGuideCallout('card')}

              ${renderFilterBar(true)}

              ${sections.length === 0 ? renderEmptyFilterState() : sections.map(sec => {
                const t = getKindTokens(sec.kind);

                  <section class="space-y-3">

                      <div class="space-y-2.5">

                          <a href="#${item.name}" onclick="event.preventDefault()" class="group block rounded-xl border border-l-4 ${t.cardWash} px-4 py-3 transition">

                              <span class="font-mono text-sm font-semibold text-slate-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition">

                    ${compact.length > 0 ? `
                      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                        ${compact.map(item => `
                          <a href="#${item.name}" onclick="event.preventDefault()" class="group flex items-center justify-between gap-2 px-3 py-2 rounded-lg border border-slate-200/80 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50 hover:bg-white dark:hover:bg-slate-800 hover:border-slate-300 dark:hover:border-slate-700 transition">
                            <span class="font-mono text-xs font-medium text-slate-700 dark:text-slate-200 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 truncate">
                              ${item.name}
                            </span>
                            <span class="text-slate-300 dark:text-slate-600 group-hover:text-indigo-500 text-xs transition">&rarr;</span>

                        `).join('')}
                      </div>
                    ` : ''}
                  </section>
                `;
              }).join('')}
            </div>
          `;
        }
      },
      'sticky-rail': {
        title: '3. Sticky Section Rail + Scannable Directory',
        desc: 'Designed for entry points with 30+ exports. Pairs a compact left-hand category rail (with live symbol counts and quick jump) alongside a clean, semantic-tinted directory on the right.',
        tags: ['Built for 37+ exports', 'Fast section jumping', 'Clear visual hierarchy'],
        render: () => {
          const sections = getFilteredSections();
          return `
            <div class="space-y-6">
              <!-- Top Entry Point Banner -->
              <div class="rounded-xl bg-slate-50/90 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-800 p-4 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 rounded text-[11px] font-semibold bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700">
                      Entry point
                    </span>
                    <span class="text-xs text-slate-500 dark:text-slate-400">${entryPoint.totalExports} exports imported from this path</span>
                  </div>
                  <div class="mt-2 flex flex-wrap items-center gap-2.5">
                    <h2 class="font-mono text-lg sm:text-xl font-bold text-slate-900 dark:text-white break-all">
                      ${entryPoint.path}
                    </h2>
                    ${renderCopyPill(entryPoint.path)}
                  </div>
                </div>
                <div class="shrink-0">
                  ${renderGuideCallout('pill')}
                </div>
              </div>

              <!-- 2-Column Split: Sticky Left Rail + Main Directory -->
              <div class="grid grid-cols-1 md:grid-cols-[190px_1fr] gap-6 items-start">
                <!-- Left Rail -->
                <aside class="md:sticky md:top-28 space-y-4">
                  <div class="relative">
                    <svg class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input
                      type="text"
                      value="${searchQuery.replace(/"/g, '&quot;')}"
                      oninput="handleSearch(this.value)"
                      placeholder="Quick find..."
                      class="w-full pl-8 pr-2.5 py-1.5 text-xs rounded-lg bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <div class="text-[11px] font-semibold uppercase tracking-wider text-slate-400 dark:text-slate-500 px-2 mb-1.5">
                      Categories
                    </div>
                    <nav class="flex md:flex-col gap-1 overflow-x-auto">
                      ${entryPoint.sections.map(sec => {
                        const t = getKindTokens(sec.kind);
                        return `
                          <a href="#rail-${sec.id}" onclick="event.preventDefault(); document.getElementById('rail-${sec.id}')?.scrollIntoView({behavior:'smooth', block:'nearest'})" class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition whitespace-nowrap">
                            <span class="flex items-center gap-2">
                              <span class="w-1.5 h-1.5 rounded-full ${t.dot}"></span>
                              ${sec.title}
                            </span>
                            <span class="font-mono text-[11px] text-slate-400 dark:text-slate-500">${sec.items.length}</span>
                          </a>
                        `;
                      }).join('')}
                    </nav>
                  </div>
                </aside>

                <!-- Right Content -->
                <div class="space-y-6 min-w-0">
                  ${sections.length === 0 ? renderEmptyFilterState() : sections.map(sec => {
                    const t = getKindTokens(sec.kind);
                    return `
                      <section id="rail-${sec.id}" class="rounded-xl border border-slate-200/90 dark:border-slate-800 overflow-hidden">
                        <div class="px-4 py-2.5 border-b ${t.headerTint} flex items-center justify-between">
                          <div class="flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full ${t.dot}"></span>
                            <h3 class="text-xs font-semibold uppercase tracking-wider ${t.badgeText}">${sec.title}</h3>
                          </div>
                          <span class="font-mono text-[11px] text-slate-500 dark:text-slate-400">${sec.items.length}</span>
                        </div>
                        <div class="divide-y divide-slate-100 dark:divide-slate-800/80">
                          ${sec.items.map(item => `
                            <a href="#${item.name}" onclick="event.preventDefault()" class="group flex flex-col sm:flex-row sm:items-baseline justify-between gap-1 sm:gap-4 px-4 py-2.5 ${t.rowHover} transition">
                              <span class="font-mono text-[13px] font-medium text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 shrink-0 transition">
                                ${item.name}
                              </span>
                              <div class="flex items-center justify-between sm:justify-end gap-3 min-w-0 flex-1">
                                ${item.descriptionHtml ? `
                                  <span class="text-xs text-slate-500 dark:text-slate-400 sm:text-right leading-relaxed">
                                    ${item.descriptionHtml}
                                  </span>
                                ` : ''}
                                <span class="text-slate-300 dark:text-slate-600 group-hover:text-indigo-500 text-xs shrink-0 transition">&rarr;</span>
                              </div>
                            </a>
                          `).join('')}
                        </div>
                      </section>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        }
      },
      'adaptive-list': {
        title: '4. Adaptive 2-Column Container List (Closest to Current)',
        desc: 'Keeps your exact grouped container structure while fixing its two pain points: adds a prominent Guide card in the header, semantic tinted section headers, and pairs undocumented items side-by-side in a 2-column grid so rows never feel hollow.',
        tags: ['Minimal migration effort', 'Zero hollow rows', 'Prominent Guide card'],
        render: () => {
          const sections = getFilteredSections();
          return `
            <div class="space-y-7">
              <!-- Split Header -->
              <div class="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-4 items-center pb-6 border-b border-slate-200/80 dark:border-slate-800">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700 dark:bg-indigo-950/80 dark:text-indigo-300 border border-indigo-200/70 dark:border-indigo-800/70">
                      Entry point
                    </span>
                    <span class="text-xs text-slate-500 dark:text-slate-400">${entryPoint.totalExports} exports</span>
                  </div>
                  <h2 class="mt-2 font-mono text-xl sm:text-2xl font-bold text-slate-900 dark:text-white break-all">
                    ${entryPoint.path}
                  </h2>
                  <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
                    Each symbol below can be imported directly from this entry point path.
                  </p>
                </div>
                <div class="flex flex-col sm:flex-row md:flex-col gap-2">
                  ${renderGuideCallout('card')}
                </div>
              </div>

              ${renderFilterBar(false)}

              <!-- Grouped Containers -->
              ${sections.length === 0 ? renderEmptyFilterState() : sections.map(sec => {
                const t = getKindTokens(sec.kind);
                return `
                  <section>
                    <div class="rounded-xl border border-slate-200/90 dark:border-slate-800 overflow-hidden bg-white dark:bg-slate-900/40">
                      <!-- Semantic Tinted Section Header -->
                      <div class="px-4 py-2.5 border-b ${t.headerTint} flex items-center justify-between">
                        <div class="flex items-center gap-2">
                          <span class="w-2 h-2 rounded-full ${t.dot}"></span>
                          <h3 class="text-sm font-semibold text-slate-900 dark:text-white">${sec.title}</h3>
                        </div>
                        <span class="text-xs font-medium ${t.badgeText}">${sec.items.length} ${sec.items.length === 1 ? 'item' : 'items'}</span>
                      </div>

                      <!-- 2-Col Adaptive Grid inside container -->
                      <div class="grid grid-cols-1 md:grid-cols-2 divide-y md:divide-y-0 divide-slate-100 dark:divide-slate-800/80">
                        ${sec.items.map((item, idx) => {
                          const isWide = Boolean(item.descriptionHtml);
                          return `
                            <a href="#${item.name}" onclick="event.preventDefault()" class="group flex flex-col justify-center px-4 py-3 ${t.rowHover} transition border-b border-slate-100 dark:border-slate-800/80 last:border-b-0 ${isWide ? 'md:col-span-2 bg-slate-50/40 dark:bg-slate-800/20' : 'md:odd:border-r md:odd:border-slate-100 dark:md:odd:border-slate-800/80'}">
                              <div class="flex items-center justify-between gap-2">
                                <span class="font-mono text-[13px] font-medium text-indigo-700 dark:text-indigo-300 group-hover:underline">
                                  ${item.name}
                                </span>
                                <span class="text-slate-300 dark:text-slate-600 group-hover:text-indigo-500 text-xs transition">&rarr;</span>
                              </div>
                              ${item.descriptionHtml ? `
                                <p class="mt-1 text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                                  ${item.descriptionHtml}
                                </p>
                              ` : ''}
                            </a>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  </section>
                `;
              }).join('')}
            </div>
          `;
        }
      },
      'editorial-index': {
        title: '5. Clean Editorial Index (Ultra-Light & Fast)',
        desc: 'Removes outer boxes completely in favor of crisp typography, left semantic accent rules, and a unified filter toolbar. Effortless to scan without visual clutter.',
        tags: ['Zero box-in-box clutter', 'Crisp left semantic rules', 'Fast visual scanning'],
        render: () => {
          const sections = getFilteredSections();
          return `
            <div class="space-y-8">
              <!-- Minimal Header -->
              <div>
                <div class="flex flex-wrap items-center justify-between gap-3">
                  <span class="inline-flex items-center gap-1.5 text-xs font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500">
                    Entry point &bull; ${entryPoint.totalExports} exports
                  </span>
                  ${renderGuideCallout('pill')}
                </div>
                <h2 class="mt-2 font-mono text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white break-all">
                  ${entryPoint.path}
                </h2>
                <div class="mt-3 flex flex-wrap items-center gap-2 text-xs text-slate-500 dark:text-slate-400">
                  <span>Import path:</span>
                  ${renderCopyPill(`import { ... } from '${entryPoint.path}';`)}
                </div>
              </div>

              <div class="pt-4 border-t border-slate-200/80 dark:border-slate-800">
                ${renderFilterBar(true)}
              </div>

              ${sections.length === 0 ? renderEmptyFilterState() : sections.map(sec => {
                const t = getKindTokens(sec.kind);
                return `
                  <section class="border-l-[3px] ${t.leftBorder} pl-4 sm:pl-5">
                    <div class="flex items-baseline gap-2.5 mb-3">
                      <h3 class="text-base font-semibold text-slate-900 dark:text-white">${sec.title}</h3>
                      <span class="font-mono text-xs text-slate-400 dark:text-slate-500">(${sec.items.length})</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-1">
                      ${sec.items.map(item => `
                        <a href="#${item.name}" onclick="event.preventDefault()" class="group py-2 border-b border-slate-100 dark:border-slate-800/70 flex flex-col justify-center ${item.descriptionHtml ? 'md:col-span-2' : ''}">
                          <div class="flex items-center justify-between gap-2">
                            <span class="font-mono text-[13px] font-medium text-slate-800 dark:text-slate-100 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition">
                              ${item.name}
                            </span>
                            <span class="text-xs text-slate-300 dark:text-slate-600 group-hover:text-indigo-500 group-hover:translate-x-0.5 transition-all">&rarr;</span>
                          </div>
                          ${item.descriptionHtml ? `
                            <p class="mt-1 text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                              ${item.descriptionHtml}
                            </p>
                          ` : ''}
                        </a>
                      `).join('')}
                    </div>
                  </section>
                `;
              }).join('')}
            </div>
          `;
        }
      }
    };

    function renderActiveConcept() {
      const concept = concepts[activeTabKey];
      document.getElementById('concept-title').textContent = concept.title;
      document.getElementById('concept-desc').textContent = concept.desc;
      document.getElementById('concept-tags').innerHTML = concept.tags.map(tag => `
        <span class="px-2.5 py-1 rounded-md text-xs font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200/60 dark:border-slate-700/60">
          ${tag}
        </span>
      `).join('');
      document.getElementById('design-stage').innerHTML = concept.render();
    }

    function selectTab(key, btnEl) {
      activeTabKey = key;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active', 'border-indigo-600', 'text-indigo-600', 'dark:border-indigo-400', 'dark:text-indigo-400');
        btn.classList.add('border-transparent', 'text-slate-500', 'dark:text-slate-400');
      });
      if (btnEl) {
        btnEl.classList.add('active', 'border-indigo-600', 'text-indigo-600', 'dark:border-indigo-400', 'dark:text-indigo-400');
        btnEl.classList.remove('border-transparent', 'text-slate-500', 'dark:text-slate-400');
      }
      renderActiveConcept();
    }

    function handleSearch(val) {
      searchQuery = val;
      const activeEl = document.activeElement;
      const selectionStart = activeEl && activeEl.selectionStart;
      renderActiveConcept();
      const newInput = document.querySelector('#design-stage input[type="text"]');
      if (newInput) {
        newInput.focus();
        if (typeof selectionStart === 'number') {
          newInput.setSelectionRange(selectionStart, selectionStart);
        }
      }
    }

    function setKindFilter(kind) {
      kindFilter = kind;
      renderActiveConcept();
    }

    function resetFilters() {
      searchQuery = '';
      kindFilter = 'ALL';
      renderActiveConcept();
    }

    // Toggle container width simulation between Narrow, Docs, and Wide
    function setWidth(maxWidthClass, btnEl) {
      const container = document.getElementById('preview-container');
      if (container) {
        container.classList.remove('max-w-2xl', 'max-w-4xl', 'max-w-5xl');
        container.classList.add(maxWidthClass);
      }

      document.querySelectorAll('.width-btn').forEach(btn => {
        btn.classList.remove('active', 'bg-white', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white', 'shadow-sm');
        btn.classList.add('text-slate-600', 'dark:text-slate-300');
      });

      if (btnEl) {
        btnEl.classList.add('active', 'bg-white', 'dark:bg-slate-700', 'text-slate-900', 'dark:text-white', 'shadow-sm');
        btnEl.classList.remove('text-slate-600', 'dark:text-slate-300');
      }
    }

    // Toggle light and dark theme classes on the root html element
    function toggleTheme() {
      const htmlEl = document.documentElement;
      if (htmlEl.classList.contains('dark')) {
        htmlEl.classList.remove('dark');
        htmlEl.classList.add('light');
      } else {
        htmlEl.classList.remove('light');
        htmlEl.classList.add('dark');
      }
    }

    // Copy import path or selector to clipboard using iframe-safe execCommand fallback
    let toastTimeoutId = null;
    function copySelector(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(`Copied: ${text}`);
      } catch (err) {
        showToast('Unable to copy to clipboard');
      }
    }

    // Display brief confirmation toast notification
    function showToast(message) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      if (!toast || !toastMsg) return;

      toastMsg.textContent = message;
      toast.classList.remove('translate-y-12', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (toastTimeoutId) {
        clearTimeout(toastTimeoutId);
      }
      toastTimeoutId = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-12', 'opacity-0');
      }, 2200);
    }

    // Initialize first tab on DOM ready
    window.addEventListener('DOMContentLoaded', () => {
      selectTab('semantic-grid', document.querySelector('.tab-btn'));
    });
  </script>
</body>
</html>
